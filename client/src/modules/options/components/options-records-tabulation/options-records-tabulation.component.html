<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="optionsForm">
        <div class="row">
            <div class="col">
                <table class="table table-bordered border-dark filter">
                    <tr>
                        <td class="col-1 align-middle text-left p-2 pl-3">
                            Type
                        </td>
                        <td class="col-11 align-middle p-2">
                            <select class="custom-select" id="typeId"
                                formControlName="typeId" (change)="onOptionTypeChange()">
                                <option [ngValue]="null" disabled>Select option type</option>
                                <option
                                    *ngFor="let optionType of optionsTypesDataService.optionsTypes$ | async"
                                    [ngValue]="optionType.id">
                                    {{optionType.data?.name}}</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    
        <div class="d-flex bd-highlight">
            <div class="w-100 bd-highlight">
                <sb-search placeholder="Search by options names" (searched)="onSearchTermChange($event)"></sb-search>
            </div>
            <div class="flex-shrink-1 bd-highlight">
                <sb-loading-animation type="bars"></sb-loading-animation>
            </div>
        </div>
    
        <!--For Small-Sized Devices Only-->
        <div class="row d-md-none">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-sm-10 text-left align-middle">Name</th>
                            <th scope="col" class="col-sm-2 text-center align-middle">Actions</th>
                        </tr>
                    </ng-container >
    
                    <ng-container body>
    
                        <ng-container *ngFor="let option of optionsDataService.options$ | async; index as i">
                            <tr>
                                <td class="text-left align-middle">
                                    {{option.data?.name}}
                                </td>
    
                                <td class="text-center align-middle">
                                    <span class="d-flex flex-row-reverse">                                        
                                        <sb-button action="delete" entity="Option" id="{{option.id}}"
                                            (delete)="onDeleteOption($event)" tooltip="Delete {{option.data?.name}}">
                                        </sb-button>
                                        <sb-button action="update" entity="Option" id="{{option.id}}"
                                            (update)="onUpdateOption($event)" tooltip="Update {{option.data?.name}}">
                                        </sb-button>
                                    </span>
                                </td>
    
                            </tr>
                        </ng-container>
                    </ng-container >
    
                    <ng-container footer>
                        <tr>
                            <td scope="col" colspan="2" class="align-middle">
                                <span class="d-flex flex-row flex-row-reverse">
                                    <sb-button action="add" entity="Option" (add)="onAddOption()">
                                    </sb-button>
                                </span>
    
                            </td>
                        </tr>
                    </ng-container>
    
                </sb-table>
            </div>
        </div>
    
        <!--For Middle-Sized Devices Upwards-->
        <div class="row d-none d-md-block">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-md-1 text-center align-middle p-2">#</th>
                            <th scope="col" class="col-md-10 text-left align-middle p-2">Name</th>
                            <th scope="col" class="col-md-1 text-center align-middle p-2">Actions</th>
                        </tr>
                    </ng-container>
    
                    <ng-container body>
    
    
                        <ng-container *ngFor="let option of optionsDataService.options$ | async; index as i">
    
                            <tr>
    
                                <td class="text-center align-middle p-2">
                                    {{i + 1 + paginationOffset}}
                                </td>
    
                                <td class="text-left align-middle p-2">
                                    {{option.data?.name}}
                                </td>                               
    
                                <td class="text-center align-middle p-2">
                                    <span class="d-flex flex-row-reverse">                                       
                                        <sb-button action="delete" entity="Option" id="{{option.id}}"
                                            (delete)="onDeleteOption($event)" tooltip="Delete {{option.data?.name}}">
                                        </sb-button>
                                        <sb-button action="update" entity="Option" id="{{option.id}}"
                                            (update)="onUpdateOption($event)" tooltip="Update {{option.data?.name}}">
                                        </sb-button>
                                    </span>
                                </td>
    
                            </tr>
    
                        </ng-container>
    
                    </ng-container >
    
                    <ng-container footer>
                        <tr>
                            <td scope="col" colspan="3" class="align-middle p-2">
                                <span class="d-flex flex-row flex-row-reverse">
                                    <sb-button action="add" entity="Option" (add)="onAddOption()">
                                    </sb-button>
                                </span>
    
                            </td>
                        </tr>
                    </ng-container>
    
                </sb-table>
            </div>
        </div>
    
        <div class="row">
            <div class="col">
                <sb-pagination (pageChanged)="onPageChange($event)" (pageSizeChanged)="onPageSizeChange($event)">
                </sb-pagination>
            </div>
        </div>
    
    </form>

</ng-container>

<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
