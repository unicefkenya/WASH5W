<form>

    <div class="d-flex bd-highlight">
        <div class="w-100 bd-highlight">
            <sb-search placeholder="Search by organisations types names" (searched)="onSearchTermChange($event)"></sb-search>
        </div>
        <div class="flex-shrink-1 bd-highlight">
            <sb-loading-animation type="bars"></sb-loading-animation>
        </div>
    </div>

    <!--For Small-Sized Devices Only-->
    <div class="row d-md-none">
        <div class="col">
            <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                <ng-container header>
                    <tr>
                        <th scope="col" class="col-sm-10 text-left align-middle">Name</th>
                        <th scope="col" class="col-sm-2 text-center align-middle">Actions</th>
                    </tr>
                </ng-container>

                <ng-container body>
                    <tr *ngFor="let organisationType of organisationsTypesDataService.organisationsTypes$ | async; index as i"  >

                        <td class="text-left align-middle">
                            {{organisationType.data?.name}}
                        </td>

                        <td class="text-center align-middle">
                            <span class="d-flex flex-row-reverse">
                                <sb-button action="delete" entity="Organisation Type" id="{{organisationType.id}}"
                                    (delete)="onDeleteOrganisationType($event)" tooltip="Delete {{organisationType.data?.name}}"></sb-button>
                                <sb-button action="update" entity="Organisation Type" id="{{organisationType.id}}"
                                    (update)="onUpdateOrganisationType($event)" tooltip="Update {{organisationType.data?.name}}"></sb-button>
                            </span>
                        </td>

                    </tr>
                </ng-container>

                <ng-container footer>
                    <tr>
                        <td scope="col" colspan="2" class="align-middle">
                            <span class="d-flex flex-row flex-row-reverse">
                                <sb-button action="add" entity="Organisation Type" (add)="onAddOrganisationType()"></sb-button>
                            </span>

                        </td>
                    </tr>
                </ng-container>

            </sb-table>
        </div>
    </div>

    <!--For Middle-Sized Devices Upwards-->
    <div class="row d-none d-md-block">
        <div class="col">
            <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                <ng-container header>
                    <tr>
                        <th scope="col" class="col-md-1 text-center align-middle">#</th>
                        <th scope="col" class="col-md-6 text-left align-middle">Name</th>
                        <th scope="col" class="col-md-2 text-center align-middle">Abbreviation</th>
                        <th scope="col" class="col-md-2 text-center align-middle">Colour Code</th>                  
                        <th scope="col" class="col-md-1 text-center align-middle">Actions</th>
                    </tr>
                </ng-container>

                <ng-container body>

                    <tr *ngFor="let organisationType of organisationsTypesDataService.organisationsTypes$ | async; index as i"  >

                        <td class="text-center align-middle">
                            {{i + 1 + paginationOffset}}
                        </td>

                        <td class="text-left align-middle">
                            {{organisationType.data?.name}}
                        </td>                         

                        <td class="text-center align-middle">
                            {{organisationType.data?.abbreviation}}
                        </td>  
                        
                        <td class="text-center align-middle">
                            {{organisationType.data?.colourCode}}
                        </td>                             

                        <td class="text-center align-middle">
                            <span class="d-flex flex-row-reverse">
                                <sb-button action="delete" entity="Organisation Type" id="{{organisationType.id}}"
                                    (delete)="onDeleteOrganisationType($event)" tooltip="Delete {{organisationType.data?.name}}"></sb-button>
                                <sb-button action="update" entity="Organisation Type" id="{{organisationType.id}}"
                                    (update)="onUpdateOrganisationType($event)" tooltip="Update {{organisationType.data?.name}}"></sb-button>
                            </span>
                        </td>

                    </tr>

                </ng-container>

                <ng-container footer>
                    <tr>
                        <td scope="col" colspan="5" class="align-middle">
                            <span class="d-flex flex-row flex-row-reverse">
                                <sb-button action="add" entity="Organisation Type" (add)="onAddOrganisationType()"></sb-button>
                            </span>

                        </td>
                    </tr>
                </ng-container>

            </sb-table>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <sb-pagination (pageChanged)="onPageChange($event)" (pageSizeChanged)="onPageSizeChange($event)">
            </sb-pagination>
        </div>
    </div>

</form>
