<form>

    <div class="d-flex bd-highlight">
        <div class="w-100 bd-highlight">
            <sb-search placeholder="Search by organisationsTypes names" (searched)="onSearchTermChange($event)">
            </sb-search>
        </div>
        <div class="flex-shrink-1 bd-highlight">
            <sb-loading-animation type="bars"></sb-loading-animation>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                <ng-container header>
                    <tr>
                        <th scope="col" class="col-sm-11 text-left align-middle">Name </th>
                        <th scope="col" class="col-sm-1 text-center align-middle">Select</th>
                    </tr>
                </ng-container>

                <ng-container body>

                    <ng-container *ngIf="desired.length > 0; else desiredUnspecified">

                        <ng-container *ngFor="let organisationType of organisationsTypesDataService.organisationsTypes$ | async">

                            <tr *ngIf="isDesired(organisationType)">

                                <td class="text-left align-middle">
                                    {{organisationType.data?.name}}
                                </td>

                                <td class="text-center align-middle">
                                    <span class="d-flex justify-content-center">

                                        <div *ngIf='selectionMode === "single"; else multi'>
                                            <sb-button action="select" entity="Organisation Type" id="{{organisationType.id}}"
                                                name="organisationType" [selected]="isSelected(organisationType)"
                                                (select)="onSelect(organisationType)">
                                            </sb-button>
                                        </div>

                                        <ng-template #multi>
                                            <sb-button action="check" entity="Organisation Type" id="{{organisationType.id}}"
                                                name="organisationType" [checked]="isChecked(organisationType)"
                                                (check)="onCheck(organisationType)" (uncheck)="onUncheck(organisationType)">
                                            </sb-button>
                                        </ng-template>

                                    </span>
                                </td>

                            </tr>

                        </ng-container>

                    </ng-container>

                    <ng-template #desiredUnspecified>

                        <ng-container *ngIf="undesired.length > 0; else undesiredUnspecified">

                            <ng-container
                                *ngFor="let organisationType of organisationsTypesDataService.organisationsTypes$ | async">

                                <tr *ngIf="!isUndesired(organisationType)">

                                    <td class="text-left align-middle">
                                        {{organisationType.data?.name}}
                                    </td>

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Organisation Type"
                                                    id="{{organisationType.id}}" name="organisationType"
                                                    [selected]="isSelected(organisationType)"
                                                    (select)="onSelect(organisationType)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Organisation Type"
                                                    id="{{organisationType.id}}" name="organisationType"
                                                    [checked]="isChecked(organisationType)" (check)="onCheck(organisationType)"
                                                    (uncheck)="onUncheck(organisationType)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                </tr>

                            </ng-container>

                        </ng-container>

                        <ng-template #undesiredUnspecified>

                            <tr *ngFor="let organisationType of organisationsTypesDataService.organisationsTypes$ | async">

                                <td class="text-left align-middle">
                                    {{organisationType.data?.name}}
                                </td>

                                <td class="text-center align-middle">
                                    <span class="d-flex justify-content-center">

                                        <div *ngIf='selectionMode === "single"; else multi'>
                                            <sb-button action="select" entity="Organisation Type" id="{{organisationType.id}}"
                                                name="organisationType" [selected]="isSelected(organisationType)"
                                                (select)="onSelect(organisationType)">
                                            </sb-button>
                                        </div>

                                        <ng-template #multi>
                                            <sb-button action="check" entity="Organisation Type" id="{{organisationType.id}}"
                                                name="organisationType" [checked]="isChecked(organisationType)"
                                                (check)="onCheck(organisationType)" (uncheck)="onUncheck(organisationType)">
                                            </sb-button>
                                        </ng-template>

                                    </span>
                                </td>

                            </tr>

                        </ng-template>

                    </ng-template>

                </ng-container>
            </sb-table>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <sb-pagination type="modal" (pageChanged)="onPageChange($event)"
                (pageSizeChanged)="onPageSizeChange($event)">
            </sb-pagination>
        </div>
    </div>

</form>
