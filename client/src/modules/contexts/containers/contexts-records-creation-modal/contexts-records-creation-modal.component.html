<sb-modal shadow="false">

    <ng-container title>
        {{title}}
    </ng-container>

    <ng-container body>

        <sb-contexts-records-creation (succeeded)="onSucceeded()" (failed)="onFailed($event)"></sb-contexts-records-creation>  
        
        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Saving Overlay -->
            <sb-message-overlay *ngSwitchCase="'saving'" activity="creating" status="saving"></sb-message-overlay>

            <!-- Saving Suceeded Overlay -->
            <sb-message-overlay *ngSwitchCase="'succeeded'" activity="creating" status="succeeded"></sb-message-overlay>

            <!-- Saving Failed Overlay -->
            <sb-message-overlay *ngSwitchCase="'failed'" activity="creating" status="failed"></sb-message-overlay>

            <!-- Saving Re-Trial Delay Overlay -->
            <sb-countdown-overlay *ngSwitchCase="'retrying'" crosshead="Retrying in" (completed)="onSave()"></sb-countdown-overlay>

            <!-- Done Overlay -->
            <sb-message-overlay *ngSwitchCase="'done'" activity="creating" status="done"></sb-message-overlay>            

        </ngContainer>       

    </ng-container>

    <ng-container footer>

        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Ready State Buttons -->
            <sb-button *ngSwitchCase="'ready'" action="save" entity="Context" (save)="onSave()"></sb-button>

            <!-- Invalid  State Buttons -->
            <sb-button *ngSwitchCase="'invalid'" action="save" entity="Context" (save)="onSave()"></sb-button>

            <!-- Saving State Buttons -->
            <sb-button *ngSwitchCase="'saving'" action="save" entity="Context" disabled="true"></sb-button>

            <!-- Succeeded State Buttons -->
            <sb-button *ngSwitchCase="'succeeded'" action="yes" entity="Context" guarded="false" (yes)="onContinue()"></sb-button>
            <sb-button *ngSwitchCase="'succeeded'" action="no" entity="Context" guarded="false" (no)="onQuit()"></sb-button>

            <!-- Failed State Buttons -->
            <sb-button *ngSwitchCase="'failed'" action="yes" entity="Context" (yes)="onRetry()"></sb-button>
            <sb-button *ngSwitchCase="'failed'" action="no" entity="Context" guarded="false" (no)="onQuit()"></sb-button>

            <!-- Retrying State Buttons -->
            <sb-button *ngSwitchCase="'retrying'" action="yes" entity="Context" disabled="true"></sb-button>
            <sb-button *ngSwitchCase="'retrying'" action="no" entity="Context" disabled="true"></sb-button>  

            <!-- Done Buttons -->
            <sb-button *ngSwitchCase="'done'" action="done" entity="Context" guarded="false" (done)="onDone()"></sb-button>            

        </ngContainer>    

    </ng-container>
    
</sb-modal>
