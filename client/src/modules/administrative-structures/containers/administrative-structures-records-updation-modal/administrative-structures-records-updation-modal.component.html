<sb-modal shadow="false">

    <ng-container title>
        {{title}}
    </ng-container>

    <ng-container body>

        <sb-administrative-structures-records-updation [id]="id"
            (openedSystemSelector)="onOpenSystemSelector()" (closedSystemSelector)="onCloseSystemSelector()"
            (openedParentAdministrativeUnitTypeSelector)="onOpenParentAdministrativeUnitTypeSelector()"
            (closedParentAdministrativeUnitTypeSelector)="onCloseParentAdministrativeUnitTypeSelector()"
            (openedSubsidiaryAdministrativeUnitTypeSelector)="onOpenSubsidiaryAdministrativeUnitTypeSelector()"
            (closedSubsidiaryAdministrativeUnitTypeSelector)="onCloseSubsidiaryAdministrativeUnitTypeSelector()"
            (succeeded)="onSucceeded()" (failed)="onFailed($event)">
        </sb-administrative-structures-records-updation>

        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Saving Overlay -->
            <sb-message-overlay *ngSwitchCase="'saving'" activity="updating" status="saving"></sb-message-overlay>

            <!-- Saving Suceeded Overlay -->
            <sb-message-overlay *ngSwitchCase="'succeeded'" activity="updating" status="succeeded"></sb-message-overlay>

            <!-- Saving Failed Overlay -->
            <sb-message-overlay *ngSwitchCase="'failed'" activity="updating" status="failed"></sb-message-overlay>

            <!-- Saving Re-Trial Delay Overlay -->
            <sb-countdown-overlay *ngSwitchCase="'retrying'" crosshead="Retrying in" (completed)="onSave()">
            </sb-countdown-overlay>

            <!-- Done Overlay -->
            <sb-message-overlay *ngSwitchCase="'done'" activity="updating" status="done"></sb-message-overlay>                   

        </ngContainer>

    </ng-container>

    <ng-container footer>

        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Ready State Buttons -->
            <sb-button *ngSwitchCase="'ready' || 'invalid'" action="save" entity="Administrative Structure" (save)="onSave()">
            </sb-button>

            <!-- Invalid  State Buttons -->
            <sb-button *ngSwitchCase="'invalid'" action="save" entity="Administrative Structure" (save)="onSave()"></sb-button>

            <!-- Saving State Buttons -->
            <sb-button *ngSwitchCase="'saving'" action="save" entity="Administrative Structure" disabled="true"></sb-button>

            <!-- Succeeded State Buttons -->
            <sb-button *ngSwitchCase="'succeeded'" action="save" entity="Administrative Structure" disabled="true"></sb-button>

            <!-- Failed State Buttons -->
            <sb-button *ngSwitchCase="'failed'" action="yes" entity="Administrative Structure" (yes)="onRetry()"></sb-button>
            <sb-button *ngSwitchCase="'failed'" action="no" entity="Administrative Structure" guarded="false" (no)="onQuit()">
            </sb-button>

            <!-- Retrying State Buttons -->
            <sb-button *ngSwitchCase="'retrying'" action="yes" entity="Administrative Structure" disabled="true"></sb-button>
            <sb-button *ngSwitchCase="'retrying'" action="no" entity="Administrative Structure" disabled="true"></sb-button>

            <!-- Done Buttons -->
            <sb-button *ngSwitchCase="'done'" action="done" entity="Administrative Structure" guarded="false" (done)="onDone()">
            </sb-button>

            <!-- Systems Selections Buttons -->
            <ng-container *ngSwitchCase="'systems-selections'">
                <sb-button action="previous" entity="Administrative Structure" tooltip="Load previous screen"
                    guarded="false" (previous)="closeSystemSelector()"></sb-button>
            </ng-container>                

            <!-- Parent Administrative Units Types Selections Buttons -->
            <ng-container *ngSwitchCase="'parent-types-selections'">
                <sb-button action="previous" entity="Administrative Structure" tooltip="Load previous screen"
                    guarded="false" (previous)="closeParentAdministrativeUnitTypeSelector()"></sb-button>
            </ng-container>

            <!-- Subsidiary Administrative Units Types Selections Buttons -->
            <ng-container *ngSwitchCase="'subsidiary-types-selections'">
                <sb-button action="previous" entity="Administrative Structure" tooltip="Load previous screen"
                    guarded="false" (previous)="closeSubsidiaryAdministrativeUnitTypeSelector()"></sb-button>
            </ng-container>            

        </ngContainer>

    </ng-container>

</sb-modal>
