<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="administrativeStructuresForm">

        <div class="row">
            <div class="col">
                <table class="table table-bordered border-dark filter">
                    <tr>
                        <td class="col-1 align-middle text-left p-2 pl-3">
                            System
                        </td>
                        <td class="col-11 align-middle p-2">
                            <select class="custom-select" id="systemId" formControlName="systemId"
                                (change)="onAdministrativeSystemChange()">
                                <option [ngValue]="null" disabled>Select admin system</option>
                                <option
                                    *ngFor="let administrativeSystem of administrativeSystemsDataService.administrativeSystems$ | async"
                                    [ngValue]="administrativeSystem.id">
                                    {{administrativeSystem.data?.name}}</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="d-flex bd-highlight">
            <div class="w-100 bd-highlight">
                <sb-search placeholder="Search by admin structures names" (searched)="onSearchTermChange($event)">
                </sb-search>
            </div>
            <div class="flex-shrink-1 bd-highlight">
                <sb-loading-animation type="bars"></sb-loading-animation>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true"
                    [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-sm-3 text-center align-middle"></th>
                            <th scope="col" class="col-sm-9 text-left align-middle">Name </th>
                        </tr>
                    </ng-container>

                    <ng-container body>

                        <ng-container *ngIf="desired.length > 0; else desiredUnspecified">

                            <ng-container
                                *ngFor="let administrativeStructure of administrativeStructuresDataService.administrativeStructures$ | async">

                                <tr *ngIf="isDesired(administrativeStructure)">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Administrative Structure"
                                                    id="{{administrativeStructure.id}}" name="administrativeStructure"
                                                    [selected]="isSelected(administrativeStructure)"
                                                    (select)="onSelect(administrativeStructure)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Administrative Structure"
                                                    id="{{administrativeStructure.id}}" name="administrativeStructure"
                                                    [checked]="isChecked(administrativeStructure)"
                                                    (check)="onCheck(administrativeStructure)"
                                                    (uncheck)="onUncheck(administrativeStructure)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{administrativeStructure.data?.subsidiaryTypeName}}
                                    </td>


                                </tr>

                            </ng-container>

                        </ng-container>

                        <ng-template #desiredUnspecified>

                            <ng-container *ngIf="undesired.length > 0; else undesiredUnspecified">

                                undesired specified

                                <ng-container
                                    *ngFor="let administrativeStructure of administrativeStructuresDataService.administrativeStructures$ | async">

                                    <tr *ngIf="!isUndesired(administrativeStructure)">

                                        <td class="text-center align-middle">
                                            <span class="d-flex justify-content-center">

                                                <div *ngIf='selectionMode === "single"; else multi'>
                                                    <sb-button action="select" entity="Administrative Structure"
                                                        id="{{administrativeStructure.id}}"
                                                        name="administrativeStructure"
                                                        [selected]="isSelected(administrativeStructure)"
                                                        (select)="onSelect(administrativeStructure)">
                                                    </sb-button>
                                                </div>

                                                <ng-template #multi>
                                                    <sb-button action="check" entity="Administrative Structure"
                                                        id="{{administrativeStructure.id}}"
                                                        name="administrativeStructure"
                                                        [checked]="isChecked(administrativeStructure)"
                                                        (check)="onCheck(administrativeStructure)"
                                                        (uncheck)="onUncheck(administrativeStructure)">
                                                    </sb-button>
                                                </ng-template>

                                            </span>
                                        </td>

                                        <td class="text-left align-middle">
                                            {{administrativeStructure.data?.subsidiaryTypeName}}
                                        </td>


                                    </tr>

                                </ng-container>

                            </ng-container>

                            <ng-template #undesiredUnspecified>

                                <tr
                                    *ngFor="let administrativeStructure of administrativeStructuresDataService.administrativeStructures$ | async">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Administrative Structure"
                                                    id="{{administrativeStructure.id}}" name="administrativeStructure"
                                                    [selected]="isSelected(administrativeStructure)"
                                                    (select)="onSelect(administrativeStructure)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Administrative Structure"
                                                    id="{{administrativeStructure.id}}" name="administrativeStructure"
                                                    [checked]="isChecked(administrativeStructure)"
                                                    (check)="onCheck(administrativeStructure)"
                                                    (uncheck)="onUncheck(administrativeStructure)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{administrativeStructure.data?.subsidiaryTypeName}}
                                    </td>


                                </tr>

                            </ng-template>

                        </ng-template>

                    </ng-container>
                </sb-table>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-pagination type="modal" (pageChanged)="onPageChange($event)"
                    (pageSizeChanged)="onPageSizeChange($event)">
                </sb-pagination>
            </div>
        </div>

    </form>

</ng-container>

<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
