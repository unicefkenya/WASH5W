<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="timePeriodsForm">

        <sb-loading-animation type="bars"></sb-loading-animation>

        <!--For Small-Sized Devices Only-->
        <div class="row d-md-none">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-sm-10 text-left align-middle">Period</th>
                            <th scope="col" class="col-sm-2 text-center align-middle">Actions</th>
                        </tr>
                    </ng-container>

                    <ng-container body>
                        <tr *ngFor="let timePeriod of timePeriodsDataService.timePeriods$ | async; index as i">

                            <td class="text-left align-middle">
                                {{getFormattedTimePeriod(timePeriod)}}
                            </td>

                            <td class="text-center align-middle">
                                <span class="d-flex flex-row-reverse">
                                    <sb-button *ngIf="timePeriod.data.open" action="close" entity="Time Period"
                                        id="{{timePeriod.id}}" (close)="onCloseTimePeriod($event)">
                                    </sb-button>
                                    <sb-button *ngIf="!timePeriod.data.open" action="close" entity="Time Period"
                                        id="{{timePeriod.id}}" disabled=""></sb-button>
                                </span>
                            </td>

                        </tr>
                    </ng-container>


                </sb-table>
            </div>
        </div>

        <!--For Middle-Sized Devices Upwards-->
        <div class="row d-none d-md-block">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-md-1 text-center align-middle">#</th>
                            <th scope="col" class="col-md-10 text-left align-middle">Period</th>
                            <th scope="col" class="col-md-1 text-center align-middle">Actions</th>
                        </tr>
                    </ng-container>

                    <ng-container body>

                        <tr *ngFor="let timePeriod of timePeriodsDataService.timePeriods$ | async; index as i">

                            <td class="text-center align-middle">
                                {{i + 1 + paginationOffset}}
                            </td>

                            <td class="text-left align-middle">
                                {{getFormattedTimePeriod(timePeriod)}}
                            </td>

                            <td class="text-center align-middle">

                                <span class="d-flex flex-row-reverse">

                                    <sb-button *ngIf="timePeriod.data.open" action="close" entity="Time Period"
                                        id="{{timePeriod.id}}" (close)="onCloseTimePeriod($event)">
                                    </sb-button>                                   

                                    <button *ngIf="!timePeriod.data.open" type="button"
                                        class="btn btn-sm btn-secondary mr-1 custom-btn" data-toggle="tooltip"
                                        data-placement="top" title="Close period" disabled>
                                        <fa-icon [icon]='["fas", "lock"]'></fa-icon>
                                    </button>

                                </span>
                            </td>

                        </tr>

                    </ng-container>


                </sb-table>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col">
                <sb-pagination (pageChanged)="onPageChange($event)" (pageSizeChanged)="onPageSizeChange($event)">
                </sb-pagination>
            </div>
        </div>

    </form>

</ng-container>

<ng-template #initialising>

    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
