<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="timePeriodsForm">

        <sb-loading-animation type="bars"></sb-loading-animation>

        <div class="row">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true"
                    [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-2 text-center align-middle"></th>
                            <th scope="col" class="col-10 text-left align-middle">Period </th>

                        </tr>
                    </ng-container>

                    <ng-container body>

                        <ng-container *ngIf="desired.length > 0; else desiredUnspecified">

                            <ng-container *ngFor="let timePeriod of timePeriodsDataService.timePeriods$ | async">

                                <tr *ngIf="isDesired(timePeriod)">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Time Period" id="{{timePeriod.id}}"
                                                    name="timePeriod" [selected]="isSelected(timePeriod)"
                                                    (select)="onSelect(timePeriod)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Time Period" id="{{timePeriod.id}}"
                                                    name="timePeriod" [checked]="isChecked(timePeriod)"
                                                    (check)="onCheck(timePeriod)" (uncheck)="onUncheck(timePeriod)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{getFormattedTimePeriod(timePeriod)}}
                                    </td>

                                </tr>

                            </ng-container>

                        </ng-container>

                        <ng-template #desiredUnspecified>

                            <ng-container *ngIf="undesired.length > 0; else undesiredUnspecified">

                                <ng-container *ngFor="let timePeriod of timePeriodsDataService.timePeriods$ | async">

                                    <tr *ngIf="!isUndesired(timePeriod)">

                                        <td class="text-center align-middle">
                                            <span class="d-flex justify-content-center">

                                                <div *ngIf='selectionMode === "single"; else multi'>
                                                    <sb-button action="select" entity="Time Period"
                                                        id="{{timePeriod.id}}" name="timePeriod"
                                                        [selected]="isSelected(timePeriod)"
                                                        (select)="onSelect(timePeriod)">
                                                    </sb-button>
                                                </div>

                                                <ng-template #multi>
                                                    <sb-button action="check" entity="Time Period"
                                                        id="{{timePeriod.id}}" name="timePeriod"
                                                        [checked]="isChecked(timePeriod)" (check)="onCheck(timePeriod)"
                                                        (uncheck)="onUncheck(timePeriod)">
                                                    </sb-button>
                                                </ng-template>

                                            </span>
                                        </td>

                                        <td class="text-left align-middle">
                                            {{getFormattedTimePeriod(timePeriod)}}
                                        </td>

                                    </tr>

                                </ng-container>

                            </ng-container>

                            <ng-template #undesiredUnspecified>

                                <tr *ngFor="let timePeriod of timePeriodsDataService.timePeriods$ | async">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Time Period" id="{{timePeriod.id}}"
                                                    name="timePeriod" [selected]="isSelected(timePeriod)"
                                                    (select)="onSelect(timePeriod)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Time Period" id="{{timePeriod.id}}"
                                                    name="timePeriod" [checked]="isChecked(timePeriod)"
                                                    (check)="onCheck(timePeriod)" (uncheck)="onUncheck(timePeriod)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{getFormattedTimePeriod(timePeriod)}}
                                    </td>

                                </tr>

                            </ng-template>

                        </ng-template>

                    </ng-container>
                </sb-table>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-pagination type="modal" (pageChanged)="onPageChange($event)"
                    (pageSizeChanged)="onPageSizeChange($event)">
                </sb-pagination>
            </div>
        </div>

    </form>

</ng-container>

<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
