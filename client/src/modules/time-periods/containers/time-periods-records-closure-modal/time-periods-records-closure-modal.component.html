<sb-modal shadow="false">

    <ng-container title>
        {{title}}
    </ng-container>

    <ng-container body>

        <sb-time-periods-records-closure [id]="id" (succeeded)="onSucceeded()" (failed)="onFailed($event)">
        </sb-time-periods-records-closure>

        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Deletion Overlay -->
            <sb-message-overlay *ngSwitchCase="'closing'" activity="closing" status="closing"></sb-message-overlay>

            <!-- Deletion Succeeded Overlay -->
            <sb-message-overlay *ngSwitchCase="'succeeded'" activity="closing" status="succeeded"></sb-message-overlay>

            <!-- Deletion Failed Overlay -->
            <sb-message-overlay *ngSwitchCase="'failed'" activity="closing" status="failed"></sb-message-overlay>

            <!-- Deletion Re-Trial Delay Overlay  -->
            <sb-countdown-overlay *ngSwitchCase="'retrying'" crosshead="Retrying in" (completed)="onClose()">
            </sb-countdown-overlay>

            <!-- Done Overlay -->
            <sb-message-overlay *ngSwitchCase="'done'" activity="closing" status="done"></sb-message-overlay>                   

        </ngContainer>

    </ng-container>

    <ng-container footer>

        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Ready State Buttons -->
            <sb-button *ngSwitchCase="'ready'" action="yes" entity="Time Period" (yes)="onClose()"></sb-button>
            <sb-button *ngSwitchCase="'ready'" action="no" entity="Time Period" guarded="false" (no)="onQuit()">
            </sb-button>

            <!-- Closing State Buttons -->
            <sb-button *ngSwitchCase="'closing'" action="yes" entity="Time Period" disabled="true"></sb-button>

            <!-- Succeeded State Buttons -->
            <sb-button *ngSwitchCase="'succeeded'" action="yes" entity="Time Period" disabled="true"></sb-button>
            <sb-button *ngSwitchCase="'succeeded'" action="no" entity="Time Period" disabled="true"></sb-button>

            <!-- Failed State Buttons -->
            <sb-button *ngSwitchCase="'failed'" action="yes" entity="Time Period" (yes)="onRetry()"></sb-button>
            <sb-button *ngSwitchCase="'failed'" action="no" entity="Time Period" guarded="false" (no)="onQuit()">
            </sb-button>

            <!-- Retrying State Buttons -->
            <sb-button *ngSwitchCase="'retrying'" action="yes" entity="Time Period" disabled="true"></sb-button>
            <sb-button *ngSwitchCase="'retrying'" action="no" entity="Time Period" disabled="true"></sb-button>

            <!-- Done Buttons -->
            <sb-button *ngSwitchCase="'done'" action="done" entity="Time Period" guarded="false" (done)="onDone()">
            </sb-button>

        </ngContainer>

    </ng-container>

</sb-modal>
