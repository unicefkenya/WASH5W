<ng-container *ngIf='page == "default"'>

    <ng-container *ngIf="initialised; else initialising">

        <div class="card-body m-0 p-0">
        
            <form [formGroup]="administrativeHierarchiesForm" class="p-0 m-0">

                <h5 class="card-title">Basic Details</h5>
                <h6 class="card-subtitle mb-3 text-muted">Please select the hierarchical subsidiary admin unit</h6>
            
                <!-- Separator -->
                <div class="bd-highlight">
                    <hr class="m-0 mt-2 mb-3 p-0 ">
                </div>

                <div class="d-flex flex-column bd-highlight">
    
                    <div class="bd-highlight">
                        <div class="input-group flex-nowrap mb-2">
                            <div class="input-group-prepend pb-0">
                                <label class="input-group-text" id="systemName">System</label>
                            </div>
                            <ng-container formGroupName="system">
                                <input type="text" class="form-control input-group-input" id="systemName" placeholder=""
                                    formControlName="systemName" disabled="">
                            </ng-container>
                            <div class="input-group-append pb-0">
                                <button type="button" class="btn btn-button-bg-color-1 selector-button" data-toggle="tooltip" data-placement="top"
                                    title="Select administrative system" disabled>
                                    <fa-icon [icon]='["fas", "bullseye"]'></fa-icon>
                                </button>
                            </div>
                        </div>
                        <div *ngIf="errors.get('system')" class="alert alert-danger mb-2" role="alert">
                            {{errors.get('system')}}
                        </div>
                    </div>
    
                    <div class="bd-highlight">
                        <div class="input-group flex-nowrap mb-2">
                            <div class="input-group-prepend pb-0">
                                <label class="input-group-text" id="commissionerName">Parent</label>
                            </div>
                            <ng-container formGroupName="commissioner">
                                <input type="text" class="form-control input-group-input" id="commissionerName" placeholder=""
                                    formControlName="commissionerName" disabled="">
                            </ng-container>
                            <div class="input-group-append pb-0">
                                <button type="button" class="btn btn-button-bg-color-1 selector-button" data-toggle="tooltip" data-placement="top"
                                    title="Select Parent administrative unit type" disabled>
                                    <fa-icon [icon]='["fas", "bullseye"]'></fa-icon>
                                </button>
                            </div>
                        </div>
                        <div *ngIf="errors.get('commissioner')" class="alert alert-danger mb-2" role="alert">
                            {{errors.get('commissioner')}}
                        </div>
                    </div>
    
                    <div class="bd-highlight">
                        <div class="input-group flex-nowrap mb-2">
                            <div class="input-group-prepend pb-0">
                                <label class="input-group-text" id="responsibleName">Subsidiary</label>
                            </div>
                            <ng-container formGroupName="responsible">
                                <input type="text" class="form-control input-group-input" id="responsibleName"
                                    placeholder="" formControlName="responsibleName" disabled="">
                            </ng-container>
                            <div class="input-group-append pb-0">
                                <button type="button" class="btn btn-button-bg-color-1 selector-button" data-toggle="tooltip" data-placement="top"
                                    title="Select Subsidiary administrative unit type"
                                    (click)="openSubsidiaryAdministrativeUnitSelector()">
                                    <fa-icon [icon]='["fas", "bullseye"]'></fa-icon>
                                </button>
                            </div>
                        </div>
                        <div *ngIf="errors.get('responsible')" class="alert alert-danger mb-2" role="alert">
                            {{errors.get('responsible')}}
                        </div>
                    </div>
    
                </div>
    
            </form>        
        
        
        </div>        



    </ng-container>


    <ng-template #initialising>

        <div class="d-flex justify-content-center m-1">
            <p class="text-center processing">
                <span>.</span><span>.</span><span>.</span>
            </p>
        </div>

    </ng-template>

</ng-container>

<ng-container *ngIf='page == "subsidiary-units"' class="p-0 m-0">

    <sb-administrative-units-records-selection [selectionMode]="'single'"
        [undesired]="getCommissionerId()? [getCommissionerId()]: []"
        [selected]="getResponsibleId()? [getResponsibleId()]: []" 
        [desiredTypes]="getPermissibleUnitTypesIds()" 
        (select)="onSelectSubsidiaryAdministrativeUnit($event)">
    </sb-administrative-units-records-selection>

</ng-container>
