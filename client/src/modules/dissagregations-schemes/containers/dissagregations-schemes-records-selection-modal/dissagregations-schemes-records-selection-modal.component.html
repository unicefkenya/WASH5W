<sb-modal shadow="false">

    <ng-container title>
        {{title}}
    </ng-container>

    <ng-container body>

        <sb-dissagregations-schemes-records-selection [selectionMode]="selectionMode" [desired]="desired" [undesired]="undesired"
            [selected]="selected" (select)="onSelect($event)" (check)="onCheck($event)" (uncheck)="onUncheck($event)">
        </sb-dissagregations-schemes-records-selection>

    </ng-container>

    <ng-container footer>

        <sb-button action="done" entity="Dissagregation Scheme" tooltip="Close Selector" guarded="false" (done)="onDone()">
        </sb-button>

    </ng-container>

</sb-modal>
