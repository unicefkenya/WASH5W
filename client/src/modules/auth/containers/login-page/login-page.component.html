<sb-layout-auth>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header">
                        <h3 class="text-center font-weight-light my-4">Login</h3>
                    </div>
                    <div class="card-body">
                        <sb-login></sb-login>
                    </div>
                    <div class="card-footer text-center">
                        <div class="form-group d-flex align-items-center justify-content-center small">
                            <a routerLink="/auth/registration">Need an account? Sign up!</a>
                            <span class="ml-2 mr-2">|</span>
                            <a routerLink="/auth/forgot-password">Forgot your password? Recover it!</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</sb-layout-auth>
