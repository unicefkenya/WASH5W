<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="workflowTransitionsForm">

        <div class="row">
            <div class="col">
                <table class="table table-bordered border-dark filter">
                    <tr>
                        <td class="col-1 align-middle text-left p-2 pl-3">
                            Workflow
                        </td>
                        <td class="col-11 align-middle p-2">
                            <select class="custom-select" id="workflowId" formControlName="workflowId"
                                (change)="onWorkflowChange()">
                                <option [ngValue]="null" disabled>Select Workflow</option>
                                <option
                                    *ngFor="let workflow of workflowsDataService.workflows$ | async"
                                    [ngValue]="workflow.id">
                                    {{workflow.data?.name}}</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="d-flex bd-highlight">
            <div class="w-100 bd-highlight">
                <sb-search placeholder="Search by workflow transitions verbs"
                    (searched)="onSearchTermChange($event)">
                </sb-search>
            </div>
            <div class="flex-shrink-1 bd-highlight">
                <sb-loading-animation type="bars"></sb-loading-animation>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-sm-11 text-left align-middle">Name </th>
                            <th scope="col" class="col-sm-1 text-center align-middle">Select</th>
                        </tr>
                    </ng-container>

                    <ng-container body>

                        <ng-container *ngIf="desired.length > 0; else desiredUnspecified">

                            <ng-container
                                *ngFor="let workflowTransition of workflowTransitionsDataService.workflowTransitions$ | async">

                                <tr *ngIf="isDesired(workflowTransition)">

                                    <td class="text-left align-middle">
                                        {{workflowTransition.data?.verb}}
                                    </td>

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Workflow Transition"
                                                    id="{{workflowTransition.id}}" name="workflowTransition"
                                                    [selected]="isSelected(workflowTransition)"
                                                    (select)="onSelect(workflowTransition)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Workflow Transition"
                                                    id="{{workflowTransition.id}}" name="workflowTransition"
                                                    [checked]="isChecked(workflowTransition)"
                                                    (check)="onCheck(workflowTransition)"
                                                    (uncheck)="onUncheck(workflowTransition)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                </tr>

                            </ng-container>

                        </ng-container>

                        <ng-template #desiredUnspecified>

                            <ng-container *ngIf="undesired.length > 0; else undesiredUnspecified">

                                undesired specified

                                <ng-container
                                    *ngFor="let workflowTransition of workflowTransitionsDataService.workflowTransitions$ | async">

                                    <tr *ngIf="!isUndesired(workflowTransition)">

                                        <td class="text-left align-middle">
                                            {{workflowTransition.data?.responsible?.name}}
                                        </td>

                                        <td class="text-center align-middle">
                                            <span class="d-flex justify-content-center">

                                                <div *ngIf='selectionMode === "single"; else multi'>
                                                    <sb-button action="select" entity="Workflow Transition"
                                                        id="{{workflowTransition.id}}"
                                                        name="workflowTransition"
                                                        [selected]="isSelected(workflowTransition)"
                                                        (select)="onSelect(workflowTransition)">
                                                    </sb-button>
                                                </div>

                                                <ng-template #multi>
                                                    <sb-button action="check" entity="Workflow Transition"
                                                        id="{{workflowTransition.id}}"
                                                        name="workflowTransition"
                                                        [checked]="isChecked(workflowTransition)"
                                                        (check)="onCheck(workflowTransition)"
                                                        (uncheck)="onUncheck(workflowTransition)">
                                                    </sb-button>
                                                </ng-template>

                                            </span>
                                        </td>

                                    </tr>

                                </ng-container>

                            </ng-container>

                            <ng-template #undesiredUnspecified>

                                <tr
                                    *ngFor="let workflowTransition of workflowTransitionsDataService.workflowTransitions$ | async">

                                    <td class="text-left align-middle">
                                        {{workflowTransition.data?.toStatusName}}
                                    </td>

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Workflow Transition"
                                                    id="{{workflowTransition.id}}" name="workflowTransition"
                                                    [selected]="isSelected(workflowTransition)"
                                                    (select)="onSelect(workflowTransition)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Workflow Transition"
                                                    id="{{workflowTransition.id}}" name="workflowTransition"
                                                    [checked]="isChecked(workflowTransition)"
                                                    (check)="onCheck(workflowTransition)"
                                                    (uncheck)="onUncheck(workflowTransition)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                </tr>

                            </ng-template>

                        </ng-template>

                    </ng-container>
                </sb-table>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-pagination type="modal" (pageChanged)="onPageChange($event)"
                    (pageSizeChanged)="onPageSizeChange($event)">
                </sb-pagination>
            </div>
        </div>

    </form>

</ng-container>

<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
