<form>

    <div class="d-flex bd-highlight">
        <div class="w-100 bd-highlight">
            <sb-search placeholder="Search by workflows names" (searched)="onSearchTermChange($event)">
            </sb-search>
        </div>
        <div class="flex-shrink-1 bd-highlight">
            <sb-loading-animation type="bars"></sb-loading-animation>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true"
                [hoverable]="true" [bordered]="true">
                <ng-container header>
                    <tr>
                        <th scope="col" class="col-sm-3 text-center align-middle"></th>
                        <th scope="col" class="col-sm-9 text-left align-middle">Name</th>
                    </tr>
                </ng-container>

                <ng-container body>

                    <ng-container *ngIf="desired.length > 0; else desiredUnspecified">

                        <ng-container *ngFor="let workflow of workflowsDataService.workflows$ | async">

                            <tr *ngIf="isDesired(workflow)">

                                <td class="text-center align-middle">
                                    <span class="d-flex justify-content-center">

                                        <div *ngIf='selectionMode === "single"; else multi'>
                                            <sb-button action="select" entity="Workflow" id="{{workflow.id}}"
                                                name="workflow" [selected]="isSelected(workflow)"
                                                (select)="onSelect(workflow)">
                                            </sb-button>
                                        </div>

                                        <ng-template #multi>
                                            <sb-button action="check" entity="Workflow" id="{{workflow.id}}"
                                                name="workflow" [checked]="isChecked(workflow)"
                                                (check)="onCheck(workflow)" (uncheck)="onUncheck(workflow)">
                                            </sb-button>
                                        </ng-template>

                                    </span>
                                </td>

                                <td class="text-left align-middle">
                                    {{workflow.data?.name}}
                                </td>

                            </tr>

                        </ng-container>

                    </ng-container>

                    <ng-template #desiredUnspecified>

                        <ng-container *ngIf="undesired.length > 0; else undesiredUnspecified">

                            <ng-container *ngFor="let workflow of workflowsDataService.workflows$ | async">

                                <tr *ngIf="!isUndesired(workflow)">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Workflow" id="{{workflow.id}}"
                                                    name="workflow" [selected]="isSelected(workflow)"
                                                    (select)="onSelect(workflow)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Workflow" id="{{workflow.id}}"
                                                    name="workflow" [checked]="isChecked(workflow)"
                                                    (check)="onCheck(workflow)" (uncheck)="onUncheck(workflow)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>


                                    <td class="text-left align-middle">
                                        {{workflow.data?.name}}
                                    </td>

                                </tr>

                            </ng-container>

                        </ng-container>

                        <ng-template #undesiredUnspecified>

                            <tr *ngFor="let workflow of workflowsDataService.workflows$ | async">

                                <td class="text-center align-middle">
                                    <span class="d-flex justify-content-center">

                                        <div *ngIf='selectionMode === "single"; else multi'>
                                            <sb-button action="select" entity="Workflow" id="{{workflow.id}}"
                                                name="workflow" [selected]="isSelected(workflow)"
                                                (select)="onSelect(workflow)">
                                            </sb-button>
                                        </div>

                                        <ng-template #multi>
                                            <sb-button action="check" entity="Workflow" id="{{workflow.id}}"
                                                name="workflow" [checked]="isChecked(workflow)"
                                                (check)="onCheck(workflow)" (uncheck)="onUncheck(workflow)">
                                            </sb-button>
                                        </ng-template>

                                    </span>
                                </td>

                                <td class="text-left align-middle">
                                    {{workflow.data?.name}}
                                </td>

                            </tr>

                        </ng-template>

                    </ng-template>

                </ng-container>
            </sb-table>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <sb-pagination type="modal" (pageChanged)="onPageChange($event)"
                (pageSizeChanged)="onPageSizeChange($event)">
            </sb-pagination>
        </div>
    </div>

</form>
