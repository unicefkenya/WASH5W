<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="administrativeUnitsForm">

        <div *ngIf="!desiredTypes || desiredTypes.length == 0" class="row">
            <div class="col">
                <table class="table table-bordered border-dark filter" style="width: 100%;">
                    <tr>
                        <td class="col-1 align-middle text-left p-2 pl-3">
                            Type
                        </td>
                        <td class="col-11 align-middle p-2">
                            <select class="custom-select" id="typeId" formControlName="typeId"
                                (change)="onAdministrativeUnitTypeChange()">
                                <option [ngValue]="null" disabled>Select administrative unit type</option>
                                <option
                                    *ngFor="let administrativeUnitType of administrativeUnitsTypesDataService.administrativeUnitsTypes$ | async"
                                    [ngValue]="administrativeUnitType.id">
                                    {{administrativeUnitType.data?.name}}</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="d-flex bd-highlight">
            <div class="bd-highlight">
                <sb-search placeholder="Search by admin units names" (searched)="onSearchTermChange($event)">
                </sb-search>
            </div>
            <div *ngIf="(administrativeUnitsDataService.loading$ | async) == true" class="flex-shrink-1 bd-highlight">
                <p class="text-center processing">
                    <span>.</span><span>.</span><span>.</span>
                </p>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-sm-3 text-center align-middle"></th>                            
                            <th scope="col" class="col-sm-9 text-left align-middle">Name </th>
                        </tr>
                    </ng-container>

                    <ng-container body>

                        <ng-container *ngIf="desired.length > 0; else desiredUnspecified">

                            <ng-container
                                *ngFor="let administrativeUnit of administrativeUnitsDataService.administrativeUnits$ | async">

                                <tr *ngIf="isDesired(administrativeUnit)">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Administrative Unit"
                                                    id="{{administrativeUnit.id}}" name="administrativeUnit"
                                                    [selected]="isSelected(administrativeUnit)"
                                                    (select)="onSelect(administrativeUnit)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Administrative Unit"
                                                    id="{{administrativeUnit.id}}" name="administrativeUnit"
                                                    [checked]="isChecked(administrativeUnit)"
                                                    (check)="onCheck(administrativeUnit)"
                                                    (uncheck)="onUncheck(administrativeUnit)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{administrativeUnit.data?.name}}
                                    </td>                                    

                                </tr>

                            </ng-container>

                        </ng-container>

                        <ng-template #desiredUnspecified>

                            <ng-container *ngIf="undesired.length > 0; else undesiredUnspecified">

                                <ng-container
                                    *ngFor="let administrativeUnit of administrativeUnitsDataService.administrativeUnits$ | async">

                                    <tr *ngIf="!isUndesired(administrativeUnit)">

                                        <td class="text-center align-middle">
                                            <span class="d-flex justify-content-center">

                                                <div *ngIf='selectionMode === "single"; else multi'>
                                                    <sb-button action="select" entity="Administrative Unit"
                                                        id="{{administrativeUnit.id}}" name="administrativeUnit"
                                                        [selected]="isSelected(administrativeUnit)"
                                                        (select)="onSelect(administrativeUnit)">
                                                    </sb-button>
                                                </div>

                                                <ng-template #multi>
                                                    <sb-button action="check" entity="Administrative Unit"
                                                        id="{{administrativeUnit.id}}" name="administrativeUnit"
                                                        [checked]="isChecked(administrativeUnit)"
                                                        (check)="onCheck(administrativeUnit)"
                                                        (uncheck)="onUncheck(administrativeUnit)">
                                                    </sb-button>
                                                </ng-template>

                                            </span>
                                        </td>

                                        <td class="text-left align-middle">
                                            {{administrativeUnit.data?.name}}
                                        </td>                                        

                                    </tr>

                                </ng-container>

                            </ng-container>

                            <ng-template #undesiredUnspecified>

                                <tr
                                    *ngFor="let administrativeUnit of administrativeUnitsDataService.administrativeUnits$ | async">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Administrative Unit"
                                                    id="{{administrativeUnit.id}}" name="administrativeUnit"
                                                    [selected]="isSelected(administrativeUnit)"
                                                    (select)="onSelect(administrativeUnit)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Administrative Unit"
                                                    id="{{administrativeUnit.id}}" name="administrativeUnit"
                                                    [checked]="isChecked(administrativeUnit)"
                                                    (check)="onCheck(administrativeUnit)"
                                                    (uncheck)="onUncheck(administrativeUnit)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{administrativeUnit.data?.name}}
                                    </td>                                    

                                </tr>

                            </ng-template>

                        </ng-template>

                    </ng-container>
                </sb-table>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-pagination type="modal" (pageChanged)="onPageChange($event)"
                    (pageSizeChanged)="onPageSizeChange($event)">
                </sb-pagination>
            </div>
        </div>

    </form>

</ng-container>

<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
