<div class="card-body m-0 p-0">

    <h5 class="card-title">Basic Details</h5>
    <h6 class="card-subtitle mb-3 text-muted">Please enter the admin unit's basic details</h6>

    <!-- Separator -->
    <div class="bd-highlight">
        <hr class="m-0 mt-2 mb-3 p-0 ">
    </div>

    <form [formGroup]="administrativeUnitsForm">

        <!-- Type -->
        <div class="d-flex flex-column bd-highlight">

            <div class="bd-highlight">
                <div class="input-group flex-nowrap mb-2">
                    <div class="input-group-prepend pb-0">
                        <label class="input-group-text">Type</label>
                    </div>
                    <select class="custom-select" id="typeId" formControlName="typeId">
                        <option [ngValue]="null" disabled>Select admin unit type</option>
                        <option
                            *ngFor="let administrativeUnitType of administrativeUnitsTypesDataService.administrativeUnitsTypes$ | async"
                            [ngValue]="administrativeUnitType.id">
                            {{administrativeUnitType.data?.name}}</option>
                    </select>
                </div>
                <div *ngIf="administrativeUnitsForm.get('typeId')?.invalid && (administrativeUnitsForm.get('typeId')?.dirty || administrativeUnitsForm.get('typeId')?.touched)"
                    class="alert alert-danger mt-3">
                    <div *ngIf="administrativeUnitsForm.get('typeId')?.errors.required">
                        Type is required
                    </div>
                </div>
            </div>

        </div>

        <!-- Name -->
        <div class="d-flex flex-column bd-highlight">

            <div class="bd-highlight">
                <div class="input-group flex-nowrap mb-2">
                    <div class="input-group-prepend pb-0">
                        <label class="input-group-text">Name</label>
                    </div>
                    <input type="text" class="form-control" id="name" placeholder="Enter admin unit's name"
                        formControlName="name">
                </div>
                <div *ngIf="administrativeUnitsForm.get('name')?.invalid && (administrativeUnitsForm.get('name')?.dirty || administrativeUnitsForm.get('name')?.touched)"
                    class="alert alert-danger mt-3">
                    <div *ngIf="administrativeUnitsForm.get('name')?.errors.required">
                        Name is required
                    </div>
                    <div *ngIf="administrativeUnitsForm.get('name')?.errors.minlength">
                        Name should be at least 2 characters long
                    </div>
                    <div *ngIf="administrativeUnitsForm.get('name')?.errors.maxlength">
                        Name should not be more than 250 characters long
                    </div>
                    <div *ngIf="administrativeUnitsForm.get('name')?.errors.exists">
                        Name should be unique
                    </div>
                </div>
            </div>

        </div>

    </form>


</div>
