<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="systemsRolesPermissionsForm">

        <div class="row">
            <div class="col">
                <table class="table table-bordered border-dark filter">
                    <tr>
                        <td class="col-1 align-middle text-left p-2 pl-3">
                            Role
                        </td>
                        <td class="col-11 align-middle p-2">
                            <select class="custom-select" id="systemRoleId" formControlName="systemRoleId"
                                (change)="onSystemRoleChange()">
                                <option ngValue="null" disabled>Select System Role</option>
                                <option *ngFor="let systemRole of systemsRolesDataService.systemsRoles$| async"
                                    [ngValue]="systemRole.id">
                                    {{systemRole.data?.name}}</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="d-flex ">
            <div class="w-100 ">
                <sb-search placeholder="Search by systems modules names" (searched)="onSearchTermChange($event)">
                </sb-search>
            </div>
            <div class="flex-shrink-1 ">
                <sb-loading-animation type="bars"></sb-loading-animation>
            </div>
        </div>


        <div class="m-0 mb-0 p-0 wrapper"
            *ngFor="let systemModule of systemsModulesDataService.systemsModules$ | async; index as i">

            <table class="table m-0 mb-1 collapsible-group" style="width:100%">

                <tr class="title">
                    <td class="col-1 pl-4 align-middle">
                        {{i + 1 + paginationOffset}}
                    </td>
                    <td class="col-9 text-left align-middle">
                        {{systemModule.data?.name}}
                    </td>
                    <td class="col-2 text-center align-middle">
                        <span class="d-flex flex-row-reverse">
                            <sb-button *ngIf="isExpanded(systemModule)" action="collapse" entity="Data Form Field"
                                id="{{systemModule?.id}}" (collapse)="onCollapse(systemModule)" tooltip="Close to hide more details">
                            </sb-button>
                            <sb-button *ngIf="isCollapsed(systemModule)" action="expand" entity="Data Form Field"
                                id="{{systemModule?.id}}" (expand)="onExpand(systemModule)" tooltip="Open to reveal more details">
                            </sb-button>
                        </span>
                    </td>
                </tr>
                
                <tr *ngFor="let systemModulePermission of getSystemModulePermissions(systemModule.id) | async; index as j">
                    <td class="col-1 pl-4 align-middle">
                        <sb-button action="check" entity="System Module Permission" id="{{systemModulePermission.id}}"
                            name="systemModulePermission" [checked]="isChecked(systemModulePermission)"
                            (check)="onCheck(systemModulePermission)" (uncheck)="onUncheck(systemModulePermission)"
                            [disabled]="!isConfigurable()">
                        </sb-button>
                    </td>
                    <td colspan="2" class="pl-4 align-left">
                        {{systemModulePermission.data.name}}
                    </td>
                </tr>
            </table>
        </div>

        <div class="row mt-3">
            <div class="col">
                <sb-pagination (pageChanged)="onPageChange($event)" (pageSizeChanged)="onPageSizeChange($event)"></sb-pagination>
            </div>
        </div>

    </form>

</ng-container>

<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
