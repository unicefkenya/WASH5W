<sb-modal shadow="false">

    <ng-container title>
        {{title}}
    </ng-container>

    <ng-container body>

        <sb-quantities-observations-records-creation [timePeriodId]="timePeriodId" [phenomenonTypeId]="phenomenonTypeId" [unitId]="unitId" [observationTypeId]="observationTypeId"
            (openedLocationSelector)="onOpenLocationSelector()" (closedLocationSelector)="onCloseLocationSelector()"
            (succeeded)="onSucceeded()" (failed)="onFailed($event)">
        </sb-quantities-observations-records-creation>

        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Saving Overlay -->
            <sb-message-overlay *ngSwitchCase="'saving'" activity="creating" status="saving"></sb-message-overlay>

            <!-- Saving Suceeded Overlay -->
            <sb-message-overlay *ngSwitchCase="'succeeded'" activity="creating" status="succeeded"></sb-message-overlay>

            <!-- Saving Failed Overlay -->
            <sb-message-overlay *ngSwitchCase="'failed'" activity="creating" status="failed"></sb-message-overlay>

            <!-- Saving Re-Trial Delay Overlay -->
            <sb-countdown-overlay *ngSwitchCase="'retrying'" crosshead="Retrying in" (completed)="onSave()">
            </sb-countdown-overlay>

            <!-- Done Overlay -->
            <sb-message-overlay *ngSwitchCase="'done'" activity="creating" status="done"></sb-message-overlay>

        </ngContainer>

    </ng-container>

    <ng-container footer>

        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Ready State Buttons -->
            <sb-button *ngSwitchCase="'ready'" action="save" entity="Observation" (save)="onSave()"></sb-button>

            <!-- Invalid  State Buttons -->
            <sb-button *ngSwitchCase="'invalid'" action="save" entity="Observation" (save)="onSave()"></sb-button>

            <!-- Saving State Buttons -->
            <sb-button *ngSwitchCase="'saving'" action="save" entity="Observation" disabled="true"></sb-button>

            <!-- Succeeded State Buttons -->
            <sb-button *ngSwitchCase="'succeeded'" action="yes" entity="Observation" guarded="false" (yes)="onContinue()">
            </sb-button>
            <sb-button *ngSwitchCase="'succeeded'" action="no" entity="Observation" guarded="false" (no)="onQuit()">
            </sb-button>

            <!-- Failed State Buttons -->
            <sb-button *ngSwitchCase="'failed'" action="yes" entity="Observation" (yes)="onRetry()"></sb-button>
            <sb-button *ngSwitchCase="'failed'" action="no" entity="Observation" guarded="false" (no)="onQuit()"></sb-button>

            <!-- Retrying State Buttons -->
            <sb-button *ngSwitchCase="'retrying'" action="yes" entity="Observation" disabled="true"></sb-button>
            <sb-button *ngSwitchCase="'retrying'" action="no" entity="Observation" disabled="true"></sb-button>

            <!-- Done Buttons -->
            <sb-button *ngSwitchCase="'done'" action="done" entity="Observation" guarded="false" (done)="onDone()">
            </sb-button>

            <!-- Locations Selections Buttons -->
            <ng-container *ngSwitchCase="'locations-selections'">
                <sb-button action="previous" entity="Observation" tooltip="Load previous screen" guarded="false"
                    (previous)="closeLocationSelector()"></sb-button>
            </ng-container>

        </ngContainer>

    </ng-container>

</sb-modal>
