<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="dissagregationsForm">

        <div class="row">
            <div class="col">
                <table class="table table-bordered border-dark filter">
                    <tr>
                        <td class="col-1 align-middle text-left p-2 pl-3">
                            Type
                        </td>
                        <td class="col-11 align-middle p-2">
                            <select class="custom-select" id="typeId"
                                formControlName="typeId" (change)="onDissagregationTypeChange()">
                                <dissagregation [ngValue]="null" disabled>Select Dissagregation Type</dissagregation>
                                <dissagregation
                                    *ngFor="let dissagregationType of dissagregationsTypesDataService.dissagregationsTypes$ | async"
                                    [ngValue]="dissagregationType.id">
                                    {{dissagregationType.data?.name}}</dissagregation>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    
        <div class="d-flex bd-highlight">
            <div class="w-100 bd-highlight">
                <sb-search placeholder="Search by dissagregations names" (searched)="onSearchTermChange($event)"></sb-search>
            </div>
            <div class="flex-shrink-1 bd-highlight">
                <sb-loading-animation type="bars"></sb-loading-animation>
            </div>
        </div>
    
        <!--For Small-Sized Devices Only-->
        <div class="row d-md-none">
            <div class="col">
    
    
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col" class="col-sm-1 text-center align-middle">#</th>
                            <th scope="col" class="col-sm-9 text-left align-middle">Name</th>
                            <th scope="col" class="col-sm-2 text-center align-middle">Actions</th>
                        </tr>
                    </thead>
    
                    <tbody>
    
                        <ng-container *ngFor="let dissagregation of dissagregationsDataService.dissagregations$ | async; index as i">
                            <tr>
                                <td class="text-center align-middle">
                                    {{i + 1 + paginationOffset}}
                                </td>
    
                                <td class="text-left align-middle">
                                    {{dissagregation.data?.name}}
                                </td>
    
                                <td class="text-center align-middle">
                                    <span class="d-flex flex-row-reverse">                                        
                                        <sb-button action="delete" entity="Dissagregation" id="{{dissagregation.id}}"
                                            (delete)="onDeleteDissagregation($event)" tooltip="Delete {{dissagregation.data?.name}}">
                                        </sb-button>
                                        <sb-button action="update" entity="Dissagregation" id="{{dissagregation.id}}"
                                            (update)="onUpdateDissagregation($event)" tooltip="Update {{dissagregation.data?.name}}">
                                        </sb-button>
                                    </span>
                                </td>
    
                            </tr>
                        </ng-container>
                    </tbody>
    
                    <tfoot>
                        <tr>
                            <td scope="col" colspan="3" class="align-middle">
                                <span class="d-flex flex-row flex-row-reverse">
                                    <sb-button action="add" entity="Dissagregation" (add)="onAddDissagregation()">
                                    </sb-button>
                                </span>
    
                            </td>
                        </tr>
                    </tfoot>
    
                </table>
            </div>
        </div>
    
        <!--For Middle-Sized Devices Upwards-->
        <div class="row d-none d-md-block">
            <div class="col">
    
                <table id="table" data-classes="table" width="100%">
                    <thead>
                        <tr>
                            <th scope="col" class="col-md-1 text-center align-middle p-2">#</th>
                            <th scope="col" class="col-md-10 text-left align-middle p-2">Name</th>
                            <th scope="col" class="col-md-1 text-center align-middle p-2">Actions</th>
                        </tr>
                    </thead>
    
                    <tbody>
    
    
                        <ng-container *ngFor="let dissagregation of dissagregationsDataService.dissagregations$ | async; index as i">
    
                            <tr>
    
                                <td class="text-center align-middle p-2">
                                    {{i + 1 + paginationOffset}}
                                </td>
    
                                <td class="text-left align-middle p-2">
                                    {{dissagregation.data?.name}}
                                </td>                               
    
                                <td class="text-center align-middle p-2">
                                    <span class="d-flex flex-row-reverse">                                       
                                        <sb-button action="delete" entity="Dissagregation" id="{{dissagregation.id}}"
                                            (delete)="onDeleteDissagregation($event)" tooltip="Delete {{dissagregation.data?.name}}">
                                        </sb-button>
                                        <sb-button action="update" entity="Dissagregation" id="{{dissagregation.id}}"
                                            (update)="onUpdateDissagregation($event)" tooltip="Update {{dissagregation.data?.name}}">
                                        </sb-button>
                                    </span>
                                </td>
    
                            </tr>
    
                        </ng-container>
    
                    </tbody>
    
                    <tfoot>
                        <tr>
                            <td scope="col" colspan="3" class="align-middle p-2">
                                <span class="d-flex flex-row flex-row-reverse">
                                    <sb-button action="add" entity="Dissagregation" (add)="onAddDissagregation()">
                                    </sb-button>
                                </span>
    
                            </td>
                        </tr>
                    </tfoot>
    
                </table>
            </div>
        </div>
    
        <div class="row">
            <div class="col">
                <sb-pagination (pageChanged)="onPageChange($event)" (pageSizeChanged)="onPageSizeChange($event)">
                </sb-pagination>
            </div>
        </div>
    
    </form>

</ng-container>

<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
