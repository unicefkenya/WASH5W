<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="dissagregationsForm">

        <div *ngIf="!desiredType" class="row m-0 p-0">
            <div class="col m-0 p-0">
                <table class="table table-bordered border-dark filter" style="width: 100%;">
                    <tr>
                        <td class="col-1 align-middle text-left p-2 pl-3">
                            Type
                        </td>
                        <td class="col-11 align-middle p-2">
                            <select class="custom-select" id="typeId" formControlName="typeId"
                                (change)="onDissagregationTypeChange()">
                                <dissagregation [ngValue]="null" disabled>Select Dissagregation Type</dissagregation>
                                <dissagregation *ngFor="let dissagregationType of dissagregationsTypesDataService.dissagregationsTypes$ | async"
                                    [ngValue]="dissagregationType.id">
                                    {{dissagregationType.data?.name}}</dissagregation>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="d-flex bd-highlight">
            <div class="bd-highlight">
                <sb-search placeholder="Search by dissagregations names" (searched)="onSearchTermChange($event)">
                </sb-search>
            </div>
            <div *ngIf="(dissagregationsDataService.loading$ | async) == true" class="flex-shrink-1 bd-highlight">
                <p class="text-center processing">
                    <span>.</span><span>.</span><span>.</span>
                </p>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-2 text-center align-middle"></th>
                            <th scope="col" class="col-10 text-left align-middle">Name </th>
                        </tr>
                    </ng-container>

                    <ng-container body>

                        <tr *ngFor="let dissagregation of dissagregationsDataService.dissagregations$ | async">

                            <td class="text-center align-middle">
                                <ng-container *ngIf='selectionMode === "single"; else multi'>
                                    <sb-button action="select" entity="Dissagregation" id="{{dissagregation.id}}" name="dissagregation"
                                        [selected]="isSelected(dissagregation)" (select)="onSelect(dissagregation)">
                                    </sb-button>
                                </ng-container>

                                <ng-template #multi>
                                    <sb-button action="check" entity="Dissagregation" id="{{dissagregation.id}}" name="dissagregation"
                                        [checked]="isChecked(dissagregation)" (check)="onCheck(dissagregation)"
                                        (uncheck)="onUncheck(dissagregation)">
                                    </sb-button>
                                </ng-template>
                            </td>

                            <td class="text-left align-middle">
                                {{dissagregation.data?.name}}
                            </td>

                        </tr>

                    </ng-container>
                </sb-table>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-pagination type="modal" (pageChanged)="onPageChange($event)"
                    (pageSizeChanged)="onPageSizeChange($event)">
                </sb-pagination>
            </div>
        </div>

    </form>

</ng-container>

<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
