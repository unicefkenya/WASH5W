<form>

    <div class="d-flex bd-highlight">
        <div class="w-100 bd-highlight">
            <sb-search placeholder="Search by options types names" (searched)="onSearchTermChange($event)">
            </sb-search>
        </div>
        <div class="flex-shrink-1 bd-highlight">
            <sb-loading-animation type="bars"></sb-loading-animation>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                <ng-container header>
                    <tr>
                        <th scope="col" class="col-2 text-center align-middle"></th>                        
                        <th scope="col" class="col-10 text-left align-middle">Name </th>
                    </tr>
                </ng-container>

                <ng-container body>

                    <ng-container *ngIf="desired.length > 0; else desiredUnspecified">

                        <ng-container *ngFor="let optionType of optionsTypesDataService.optionsTypes$ | async">

                            <tr *ngIf="isDesired(optionType)">

                                <td class="text-center align-middle">
                                    <span class="d-flex justify-content-center">

                                        <div *ngIf='selectionMode === "single"; else multi'>
                                            <sb-button action="select" entity="Option Type" id="{{optionType.id}}"
                                                name="optionType" [selected]="isSelected(optionType)"
                                                (select)="onSelect(optionType)">
                                            </sb-button>
                                        </div>

                                        <ng-template #multi>
                                            <sb-button action="check" entity="Option Type" id="{{optionType.id}}"
                                                name="optionType" [checked]="isChecked(optionType)"
                                                (check)="onCheck(optionType)" (uncheck)="onUncheck(optionType)">
                                            </sb-button>
                                        </ng-template>

                                    </span>
                                </td>

                                <td class="text-left align-middle">
                                    {{optionType.data?.name}}
                                </td>                                

                            </tr>

                        </ng-container>

                    </ng-container>

                    <ng-template #desiredUnspecified>

                        <ng-container *ngIf="undesired.length > 0; else undesiredUnspecified">

                            <ng-container
                                *ngFor="let optionType of optionsTypesDataService.optionsTypes$ | async">

                                <tr *ngIf="!isUndesired(optionType)">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Option Type"
                                                    id="{{optionType.id}}" name="optionType"
                                                    [selected]="isSelected(optionType)"
                                                    (select)="onSelect(optionType)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Option Type"
                                                    id="{{optionType.id}}" name="optionType"
                                                    [checked]="isChecked(optionType)" (check)="onCheck(optionType)"
                                                    (uncheck)="onUncheck(optionType)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{optionType.data?.name}}
                                    </td>                                    

                                </tr>

                            </ng-container>

                        </ng-container>

                        <ng-template #undesiredUnspecified>

                            <tr *ngFor="let optionType of optionsTypesDataService.optionsTypes$ | async">

                                <td class="text-center align-middle">
                                    <span class="d-flex justify-content-center">

                                        <div *ngIf='selectionMode === "single"; else multi'>
                                            <sb-button action="select" entity="Option Type" id="{{optionType.id}}"
                                                name="optionType" [selected]="isSelected(optionType)"
                                                (select)="onSelect(optionType)">
                                            </sb-button>
                                        </div>

                                        <ng-template #multi>
                                            <sb-button action="check" entity="Option Type" id="{{optionType.id}}"
                                                name="optionType" [checked]="isChecked(optionType)"
                                                (check)="onCheck(optionType)" (uncheck)="onUncheck(optionType)">
                                            </sb-button>
                                        </ng-template>

                                    </span>
                                </td>

                                <td class="text-left align-middle">
                                    {{optionType.data?.name}}
                                </td>                                

                            </tr>

                        </ng-template>

                    </ng-template>

                </ng-container>
            </sb-table>
        </div>
    </div>

    <div class="row mt-2">
        <div class="col text-center">
            <sb-pagination type="modal" (pageChanged)="onPageChange($event)"
                (pageSizeChanged)="onPageSizeChange($event)">
            </sb-pagination>
        </div>
    </div>

</form>
