<sb-modal shadow="false">

    <ng-container title>
        {{title}}
    </ng-container>

    <ng-container body>

        <sb-indicators-records-updation [id]="id" [logical]="logical" [numbered]="numbered"
            (loadedStandalonePage)="onLoadStandalonePage()" (loadedFirstPage)="onLoadFirstPage()"
            (loadedNestedPage)="onLoadNestedPage()" (loadedLastPage)="onLoadLastPage()"
            (openedLogicalElementSelector)="onOpenLogicalElementSelector()"
            (closedLogicalElementSelector)="onCloseLogicalElementSelector()" (succeeded)="onSucceeded()"
            (failed)="onFailed($event)">
        </sb-indicators-records-updation>

        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Saving Overlay -->
            <sb-message-overlay *ngSwitchCase="'saving'" activity="updating" status="saving"></sb-message-overlay>

            <!-- Saving Suceeded Overlay -->
            <sb-message-overlay *ngSwitchCase="'succeeded'" activity="updating" status="succeeded"></sb-message-overlay>

            <!-- Saving Failed Overlay -->
            <sb-message-overlay *ngSwitchCase="'failed'" activity="updating" status="failed"></sb-message-overlay>

            <!-- Saving Re-Trial Delay Overlay -->
            <sb-countdown-overlay *ngSwitchCase="'retrying'" crosshead="Retrying in" (completed)="onSave()">
            </sb-countdown-overlay>

            <!-- Done Overlay -->
            <sb-message-overlay *ngSwitchCase="'done'" activity="updating" status="done"></sb-message-overlay>

        </ngContainer>

    </ng-container>

    <ng-container footer>

        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Standalone Page State Buttons -->
            <ng-container *ngSwitchCase="'standalone'">
                <sb-button action="save" entity="Indicator" (save)="onSave()"></sb-button>
            </ng-container>

            <!-- First Page State Buttons -->
            <ng-container *ngSwitchCase="'first'">
                <sb-button action="next" entity="Indicator" (next)="onNext()"></sb-button>
            </ng-container>

            <!-- Nested Page State Buttons -->
            <ng-container *ngSwitchCase="'nested'">
                <sb-button action="previous" entity="Indicator" (previous)="onPrevious()"></sb-button>
                <sb-button action="next" entity="Indicator" (next)="onNext()"></sb-button>
            </ng-container>

            <!-- Last Page State Buttons -->
            <ng-container *ngSwitchCase="'last'">
                <sb-button action="previous" entity="Indicator" (previous)="onPrevious()"></sb-button>
                <sb-button action="save" entity="Indicator" (save)="onSave()"></sb-button>
            </ng-container>

            <!-- Invalid  State Buttons -->
            <sb-button *ngSwitchCase="'invalid'" action="save" entity="Indicator" (save)="onSave()"></sb-button>

            <!-- Saving State Buttons -->
            <sb-button *ngSwitchCase="'saving'" action="save" entity="Indicator" disabled="true"></sb-button>

            <!-- Succeeded State Buttons -->
            <sb-button *ngSwitchCase="'succeeded'" action="save" entity="Indicator" disabled="true"></sb-button>

            <!-- Failed State Buttons -->
            <sb-button *ngSwitchCase="'failed'" action="yes" entity="Indicator" (yes)="onRetry()"></sb-button>
            <sb-button *ngSwitchCase="'failed'" action="no" entity="Indicator" guarded="false" (no)="onQuit()">
            </sb-button>

            <!-- Retrying State Buttons -->
            <sb-button *ngSwitchCase="'retrying'" action="yes" entity="Indicator" disabled="true"></sb-button>
            <sb-button *ngSwitchCase="'retrying'" action="no" entity="Indicator" disabled="true"></sb-button>

            <!-- Done Buttons -->
            <sb-button *ngSwitchCase="'done'" action="done" entity="Indicator" guarded="false" (done)="onDone()">
            </sb-button>

            <!-- Logical Elements Selections Buttons -->
            <ng-container *ngSwitchCase="'logical-elements-selections'">
                <sb-button action="previous" entity="Indicator" tooltip="Load previous screen" guarded="false"
                    (previous)="closeLogicalElementSelector()"></sb-button>
            </ng-container>

        </ngContainer>

    </ng-container>

</sb-modal>
