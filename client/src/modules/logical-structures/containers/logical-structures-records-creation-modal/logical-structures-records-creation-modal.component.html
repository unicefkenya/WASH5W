<sb-modal shadow="false">

    <ng-container title>
        {{title}}
    </ng-container>

    <ng-container body>

        <sb-logical-structures-records-creation [schemeId]="schemeId"
            (openedSchemeSelector)="onOpenSchemeSelector()" (closedSchemeSelector)="onCloseSchemeSelector()"
            (openedParentLogicalElementTypeSelector)="onOpenParentLogicalElementTypeSelector()"
            (closedParentLogicalElementTypeSelector)="onCloseParentLogicalElementTypeSelector()"
            (openedSubsidiaryLogicalElementTypeSelector)="onOpenSubsidiaryLogicalElementTypeSelector()"
            (closedSubsidiaryLogicalElementTypeSelector)="onCloseSubsidiaryLogicalElementTypeSelector()"
            (succeeded)="onSucceeded()" (failed)="onFailed($event)">
        </sb-logical-structures-records-creation>

        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Saving Overlay -->
            <sb-message-overlay *ngSwitchCase="'saving'" activity="creating" status="saving"></sb-message-overlay>

            <!-- Saving Suceeded Overlay -->
            <sb-message-overlay *ngSwitchCase="'succeeded'" activity="creating" status="succeeded"></sb-message-overlay>

            <!-- Saving Failed Overlay -->
            <sb-message-overlay *ngSwitchCase="'failed'" activity="creating" status="failed"></sb-message-overlay>

            <!-- Saving Re-Trial Delay Overlay -->
            <sb-countdown-overlay *ngSwitchCase="'retrying'" crosshead="Retrying in" (completed)="onSave()">
            </sb-countdown-overlay>

            <!-- Done Overlay -->
            <sb-message-overlay *ngSwitchCase="'done'" activity="creating" status="done"></sb-message-overlay>

        </ngContainer>

    </ng-container>

    <ng-container footer>

        <ngContainer [ngSwitch]="(status$ | async)">

            <!-- Ready State Buttons -->
            <sb-button *ngSwitchCase="'ready'" action="save" entity="Logical Structure" (save)="onSave()">
            </sb-button>

            <!-- Invalid  State Buttons -->
            <sb-button *ngSwitchCase="'invalid'" action="save" entity="Logical Structure" (save)="onSave()">
            </sb-button>

            <!-- Saving State Buttons -->
            <sb-button *ngSwitchCase="'saving'" action="save" entity="Logical Structure" disabled="true">
            </sb-button>

            <!-- Succeeded State Buttons -->
            <sb-button *ngSwitchCase="'succeeded'" action="yes" entity="Logical Structure" guarded="false"
                (yes)="onContinue()"></sb-button>
            <sb-button *ngSwitchCase="'succeeded'" action="no" entity="Logical Structure" guarded="false"
                (no)="onQuit()"></sb-button>

            <!-- Failed State Buttons -->
            <sb-button *ngSwitchCase="'failed'" action="yes" entity="Logical Structure" (yes)="onRetry()">
            </sb-button>
            <sb-button *ngSwitchCase="'failed'" action="no" entity="Logical Structure" guarded="false"
                (no)="onQuit()"></sb-button>

            <!-- Retrying State Buttons -->
            <sb-button *ngSwitchCase="'retrying'" action="yes" entity="Logical Structure" disabled="true">
            </sb-button>
            <sb-button *ngSwitchCase="'retrying'" action="no" entity="Logical Structure" disabled="true">
            </sb-button>

            <!-- Done Buttons -->
            <sb-button *ngSwitchCase="'done'" action="done" entity="Logical Structure" guarded="false"
                (done)="onDone()"></sb-button>

            <!-- Schemes Selections Buttons -->
            <ng-container *ngSwitchCase="'schemes-selections'">
                <sb-button action="previous" entity="Logical Structure" tooltip="Load previous screen"
                    guarded="false" (previous)="closeSchemeSelector()"></sb-button>
            </ng-container>

            <!-- Parent Administrative Units Types Selections Buttons -->
            <ng-container *ngSwitchCase="'parent-types-selections'">
                <sb-button action="previous" entity="Logical Structure" tooltip="Load previous screen"
                    guarded="false" (previous)="closeParentLogicalElementTypeSelector()"></sb-button>
            </ng-container>

            <!-- Subsidiary Administrative Units Types Selections Buttons -->
            <ng-container *ngSwitchCase="'subsidiary-types-selections'">
                <sb-button action="previous" entity="Logical Structure" tooltip="Load previous screen"
                    guarded="false" (previous)="closeSubsidiaryLogicalElementTypeSelector()"></sb-button>
            </ng-container>

        </ngContainer>

    </ng-container>

</sb-modal>
