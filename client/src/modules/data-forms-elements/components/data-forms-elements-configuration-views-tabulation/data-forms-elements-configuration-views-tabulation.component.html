<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="dataFormElementsForm">

        <div class="row p-0 m-0">
            <div class="col p-0 m-0">
                <table class="table table-bordered border-dark filter">
                    <tr>
                        <td class="col-1 align-middle text-left">
                            Form
                        </td>
                        <td class="col-11 align-middle">
                            <select class="custom-select" id="dataFormId" formControlName="dataFormId"
                                (change)="onDataFormChange()">
                                <option ngValue="null" disabled>Select data form</option>
                                <option *ngFor="let dataForm of dataFormsDataService.dataForms$| async"
                                    [ngValue]="dataForm.id">
                                    {{dataForm.data?.name}}</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="d-flex bd-highlight">
            <div class="w-100 bd-highlight">
                <sb-search placeholder="Search by field names" (searched)="onSearchTermChange($event)"></sb-search>
            </div>
            <div class="flex-shrink-1 bd-highlight">
                <sb-loading-animation type="bars"></sb-loading-animation>
            </div>
        </div>


        <ng-container *ngFor="let dataFormElement of dataFormsElementsDataService.topLevelDataFormElements$ | async">
            <sb-data-forms-groups-records-configuration-views *ngIf="dataFormElement.data?.categoryId == 1"
                [dataFormElement]="dataFormElement"
                [nestedDataFormElements]="getNestedDataFormElements(dataFormElement.id)"></sb-data-forms-groups-records-configuration-views>
            <sb-data-forms-fields-records-configuration-views *ngIf="dataFormElement.data?.categoryId == 2"
                [dataFormElement]="dataFormElement"></sb-data-forms-fields-records-configuration-views>
        </ng-container>

        <div class="d-none d-md-block m-0 p-0">
            <div class="d-flex justify-content-end mt-4">
                <div class="btn-toolbar mb-3" role="toolbar" aria-label="Data Form Elements Creation Tools">
                    <div class="btn-group mr-1" role="group" aria-label="Creation Tools">
                        <button type="button" title="Add Data Form Group" class="btn btn-button-bg-color-1"
                            (click)="onAddDataFormElement(1)">
                            <fa-icon [icon]='["fas", "plus"]'></fa-icon> Group
                        </button>
                        <button type="button" title="Add Data Form Field" class="btn btn-button-bg-color-1"
                            (click)="onAddDataFormElement(2)">
                            <fa-icon [icon]='["fas", "plus"]'></fa-icon> Field
                        </button>
                    </div>
                </div>
            </div>       
    
        </div>

        <div class="d-md-none m-0 p-0">
            <div class="d-flex justify-content-center mt-4">
                <div class="btn-toolbar mb-3" role="toolbar" aria-label="Data Form Elements Creation Tools">
                    <div class="btn-group mr-1" role="group" aria-label="Creation Tools">
                        <button type="button" title="Add Data Form Group" class="btn btn-button-bg-color-1"
                            (click)="onAddDataFormElement(1)">
                            <fa-icon [icon]='["fas", "plus"]'></fa-icon> Group
                        </button>
                        <button type="button" title="Add Data Form Field" class="btn btn-button-bg-color-1"
                            (click)="onAddDataFormElement(2)">
                            <fa-icon [icon]='["fas", "plus"]'></fa-icon> Field
                        </button>
                    </div>
                </div>
            </div>       
    
        </div>        


    </form>

</ng-container>

<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
