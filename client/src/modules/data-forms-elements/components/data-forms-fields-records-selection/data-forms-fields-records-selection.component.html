<ng-container *ngIf="initialised; else initialising">
    <form [formGroup]="dataFormElementsForm">

        <div class="row p-0 m-0">
            <div class="col p-0 m-0">
                <table class="table table-bordered border-dark filter">
                    <tr *ngIf="!dataFormId">
                        <td class="col-1 align-middle text-left">
                            Form
                        </td>
                        <td class="col-11 align-middle">
                            <select class="custom-select" id="dataFormId" formControlName="dataFormId"
                                (change)="onDataFormChange()">
                                <option ngValue="null" disabled>Select Data Form</option>
                                <option *ngFor="let dataForm of dataFormsDataService.dataForms$| async"
                                    [ngValue]="dataForm.id">
                                    {{dataForm.data?.name}}</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="d-flex bd-highlight">
            <div class="w-100 bd-highlight">
                <sb-search placeholder="Search by field names" (searched)="onSearchTermChange($event)"></sb-search>
            </div>
            <div class="flex-shrink-1 bd-highlight">
                <sb-loading-animation type="bars"></sb-loading-animation>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-sm-2 text-center align-middle"></th>
                            <th scope="col" class="col-sm-10 text-left align-middle">Title </th>
                        </tr>
                    </ng-container>

                    <ng-container body>

                        <ng-container *ngIf="desired.length > 0; else desiredUnspecified">

                            <ng-container
                                *ngFor="let dataFormElement of dataFormsElementsDataService.dataFormElements$ | async">

                                <tr *ngIf="isDesired(dataFormElement)">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Data Form"
                                                    id="{{dataFormElement.id}}" name="dataFormElement"
                                                    [selected]="isSelected(dataFormElement)"
                                                    (select)="onSelect(dataFormElement)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Data Form" id="{{dataFormElement.id}}"
                                                    name="dataFormElement" [checked]="isChecked(dataFormElement)"
                                                    (check)="onCheck(dataFormElement)"
                                                    (uncheck)="onUncheck(dataFormElement)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{dataFormElement.data?.title}}
                                    </td>

                                </tr>

                            </ng-container>

                        </ng-container>

                        <ng-template #desiredUnspecified>

                            <ng-container *ngIf="undesired.length > 0; else undesiredUnspecified">

                                <ng-container
                                    *ngFor="let dataFormElement of dataFormsElementsDataService.dataFormElements$ | async">


                                    <tr *ngIf="!isUndesired(dataFormElement)">

                                        <td class="text-center align-middle">
                                            <span class="d-flex justify-content-center">

                                                <div *ngIf='selectionMode === "single"; else multi'>
                                                    <sb-button action="select" entity="Data Form"
                                                        id="{{dataFormElement.id}}" name="dataFormElement"
                                                        [selected]="isSelected(dataFormElement)"
                                                        (select)="onSelect(dataFormElement)">
                                                    </sb-button>
                                                </div>

                                                <ng-template #multi>
                                                    <sb-button action="check" entity="Data Form"
                                                        id="{{dataFormElement.id}}" name="dataFormElement"
                                                        [checked]="isChecked(dataFormElement)"
                                                        (check)="onCheck(dataFormElement)"
                                                        (uncheck)="onUncheck(dataFormElement)">
                                                    </sb-button>
                                                </ng-template>

                                            </span>
                                        </td>

                                        <td class="text-left align-middle">
                                            {{dataFormElement.data?.title}}
                                        </td>

                                    </tr>

                                </ng-container>

                            </ng-container>

                            <ng-template #undesiredUnspecified>

                                <ng-container
                                    *ngFor="let dataFormElement of dataFormsElementsDataService.dataFormElements$ | async">

                                    <tr>

                                        <td class="text-center align-middle">
                                            <span class="d-flex justify-content-center">

                                                <div *ngIf='selectionMode === "single"; else multi'>
                                                    <sb-button action="select" entity="Data Form"
                                                        id="{{dataFormElement.id}}" name="dataFormElement"
                                                        [selected]="isSelected(dataFormElement)"
                                                        (select)="onSelect(dataFormElement)">
                                                    </sb-button>
                                                </div>

                                                <ng-template #multi>
                                                    <sb-button action="check" entity="Data Form"
                                                        id="{{dataFormElement.id}}" name="dataFormElement"
                                                        [checked]="isChecked(dataFormElement)"
                                                        (check)="onCheck(dataFormElement)"
                                                        (uncheck)="onUncheck(dataFormElement)">
                                                    </sb-button>
                                                </ng-template>

                                            </span>
                                        </td>


                                        <td class="text-left align-middle">
                                            {{dataFormElement.data?.title}}
                                        </td>


                                    </tr>

                                </ng-container>

                            </ng-template>

                        </ng-template>

                    </ng-container>
                </sb-table>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-pagination type="modal" (pageChanged)="onPageChange($event)"
                    (pageSizeChanged)="onPageSizeChange($event)">
                </sb-pagination>
            </div>
        </div>

    </form>
</ng-container>
<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
