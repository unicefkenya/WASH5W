<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="systemsModulesPermissionsForm">

        <div *ngIf="!desiredTypes || desiredTypes.length == 0" class="row m-0 p-0">
            <div class="col m-0 p-0">
                <table class="table table-bordered border-dark filter" style="width: 100%;">
                    <tr>
                        <td class="col-1 align-middle text-left p-2 pl-3">
                            Type
                        </td>
                        <td class="col-11 align-middle p-2">
                            <select class="custom-select" id="systemModuleId" formControlName="systemModuleId"
                                (change)="onSystemModuleChange()">
                                <option [ngValue]="null" disabled>Select System Module</option>
                                <option *ngFor="let systemModule of systemsModulesDataService.systemsModules$ | async"
                                    [ngValue]="systemModule.id">
                                    {{systemModule.data?.name}}</option>s
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="d-flex bd-highlight">
            <div class="bd-highlight">
                <sb-search placeholder="Search by systems modules permissions names"
                    (searched)="onSearchTermChange($event)">
                </sb-search>
            </div>
            <div *ngIf="(systemsModulesPermissionsDataService.loading$ | async) == true"
                class="flex-shrink-1 bd-highlight">
                <p class="text-center processing">
                    <span>.</span><span>.</span><span>.</span>
                </p>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true"
                    [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-sm-3 text-center align-middle"></th>
                            <th scope="col" class="col-sm-9 text-left align-middle">Name </th>
                        </tr>
                    </ng-container>

                    <ng-container body>

                        <ng-container *ngIf="desired.length > 0; else desiredUnspecified">

                            <ng-container
                                *ngFor="let systemModulePermission of systemsModulesPermissionsDataService.systemsModulesPermissions$ | async">

                                <tr *ngIf="isDesired(systemModulePermission)">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="System Module Permission"
                                                    id="{{systemModulePermission.id}}" name="systemModulePermission"
                                                    [selected]="isSelected(systemModulePermission)"
                                                    (select)="onSelect(systemModulePermission)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="System Module Permission"
                                                    id="{{systemModulePermission.id}}" name="systemModulePermission"
                                                    [checked]="isChecked(systemModulePermission)"
                                                    (check)="onCheck(systemModulePermission)"
                                                    (uncheck)="onUncheck(systemModulePermission)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{systemModulePermission.data?.name}}
                                    </td>

                                </tr>

                            </ng-container>

                        </ng-container>

                        <ng-template #desiredUnspecified>

                            <ng-container *ngIf="undesired.length > 0; else undesiredUnspecified">

                                <ng-container
                                    *ngFor="let systemModulePermission of systemsModulesPermissionsDataService.systemsModulesPermissions$ | async">

                                    <tr *ngIf="!isUndesired(systemModulePermission)">

                                        <td class="text-center align-middle">
                                            <span class="d-flex justify-content-center">

                                                <div *ngIf='selectionMode === "single"; else multi'>
                                                    <sb-button action="select" entity="System Module Permission"
                                                        id="{{systemModulePermission.id}}" name="systemModulePermission"
                                                        [selected]="isSelected(systemModulePermission)"
                                                        (select)="onSelect(systemModulePermission)">
                                                    </sb-button>
                                                </div>

                                                <ng-template #multi>
                                                    <sb-button action="check" entity="System Module Permission"
                                                        id="{{systemModulePermission.id}}" name="systemModulePermission"
                                                        [checked]="isChecked(systemModulePermission)"
                                                        (check)="onCheck(systemModulePermission)"
                                                        (uncheck)="onUncheck(systemModulePermission)">
                                                    </sb-button>
                                                </ng-template>

                                            </span>
                                        </td>

                                        <td class="text-left align-middle">
                                            {{systemModulePermission.data?.name}}
                                        </td>

                                    </tr>

                                </ng-container>

                            </ng-container>

                            <ng-template #undesiredUnspecified>

                                <tr
                                    *ngFor="let systemModulePermission of systemsModulesPermissionsDataService.systemsModulesPermissions$ | async">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="System Module Permission"
                                                    id="{{systemModulePermission.id}}" name="systemModulePermission"
                                                    [selected]="isSelected(systemModulePermission)"
                                                    (select)="onSelect(systemModulePermission)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="System Module Permission"
                                                    id="{{systemModulePermission.id}}" name="systemModulePermission"
                                                    [checked]="isChecked(systemModulePermission)"
                                                    (check)="onCheck(systemModulePermission)"
                                                    (uncheck)="onUncheck(systemModulePermission)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{systemModulePermission.data?.name}}
                                    </td>

                                </tr>

                            </ng-template>

                        </ng-template>

                    </ng-container>
                </sb-table>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-pagination type="modal" (pageChanged)="onPageChange($event)"
                    (pageSizeChanged)="onPageSizeChange($event)">
                </sb-pagination>
            </div>
        </div>

    </form>

</ng-container>

<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
