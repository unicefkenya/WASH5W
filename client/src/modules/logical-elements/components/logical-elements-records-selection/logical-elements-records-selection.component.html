<ng-container *ngIf="initialised; else initialising">

    <form [formGroup]="logicalElementsForm">

        <div *ngIf="!desiredTypes || desiredTypes.length == 0" class="row">
            <div class="col">
                <table class="table table-bordered border-dark filter" style="width: 100%;">                    
                    <tr>
                        <td class="col-1 align-middle text-left p-2 pl-3">
                            Type
                        </td>
                        <td class="col-11 align-middle p-2">
                            <select class="custom-select" id="typeId" formControlName="typeId"
                                (change)="onLogicalElementTypeChange()">
                                <option [ngValue]="null" disabled>Select logical element type</option>
                                <option
                                    *ngFor="let logicalElementType of logicalElementsTypesDataService.logicalElementsTypes$ | async"
                                    [ngValue]="logicalElementType.id">
                                    {{logicalElementType.data?.plural}}</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="d-flex bd-highlight">
            <div class="bd-highlight">
                <sb-search placeholder="Search by logical elements names" (searched)="onSearchTermChange($event)">
                </sb-search>
            </div>
            <div *ngIf="(logicalElementsDataService.loading$ | async) == true" class="flex-shrink-1 bd-highlight">
                <p class="text-center processing">
                    <span>.</span><span>.</span><span>.</span>
                </p>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                    <ng-container header>
                        <tr>
                            <th scope="col" class="col-sm-2 text-center align-middle"></th>                            
                            <th scope="col" class="col-sm-10 text-left align-middle">Name </th>
                        </tr>
                    </ng-container>

                    <ng-container body>

                        <ng-container *ngIf="desired.length > 0; else desiredUnspecified">

                            <ng-container
                                *ngFor="let logicalElement of logicalElementsDataService.logicalElements$ | async">

                                <tr *ngIf="isDesired(logicalElement)">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Logical Element"
                                                    id="{{logicalElement.id}}" name="logicalElement"
                                                    [selected]="isSelected(logicalElement)"
                                                    (select)="onSelect(logicalElement)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Logical Element"
                                                    id="{{logicalElement.id}}" name="logicalElement"
                                                    [checked]="isChecked(logicalElement)"
                                                    (check)="onCheck(logicalElement)"
                                                    (uncheck)="onUncheck(logicalElement)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{logicalElement.data?.name}}
                                    </td>

                                </tr>

                            </ng-container>

                        </ng-container>

                        <ng-template #desiredUnspecified>

                            <ng-container *ngIf="undesired.length > 0; else undesiredUnspecified">

                                <ng-container
                                    *ngFor="let logicalElement of logicalElementsDataService.logicalElements$ | async">

                                    <tr *ngIf="!isUndesired(logicalElement)">

                                        <td class="text-center align-middle">
                                            <span class="d-flex justify-content-center">

                                                <div *ngIf='selectionMode === "single"; else multi'>
                                                    <sb-button action="select" entity="Logical Element"
                                                        id="{{logicalElement.id}}" name="logicalElement"
                                                        [selected]="isSelected(logicalElement)"
                                                        (select)="onSelect(logicalElement)">
                                                    </sb-button>
                                                </div>

                                                <ng-template #multi>
                                                    <sb-button action="check" entity="Logical Element"
                                                        id="{{logicalElement.id}}" name="logicalElement"
                                                        [checked]="isChecked(logicalElement)"
                                                        (check)="onCheck(logicalElement)"
                                                        (uncheck)="onUncheck(logicalElement)">
                                                    </sb-button>
                                                </ng-template>

                                            </span>
                                        </td>

                                        <td class="text-left align-middle">
                                            {{logicalElement.data?.name}}
                                        </td>                                        

                                    </tr>

                                </ng-container>

                            </ng-container>

                            <ng-template #undesiredUnspecified>

                                <tr
                                    *ngFor="let logicalElement of logicalElementsDataService.logicalElements$ | async">

                                    <td class="text-center align-middle">
                                        <span class="d-flex justify-content-center">

                                            <div *ngIf='selectionMode === "single"; else multi'>
                                                <sb-button action="select" entity="Logical Element"
                                                    id="{{logicalElement.id}}" name="logicalElement"
                                                    [selected]="isSelected(logicalElement)"
                                                    (select)="onSelect(logicalElement)">
                                                </sb-button>
                                            </div>

                                            <ng-template #multi>
                                                <sb-button action="check" entity="Logical Element"
                                                    id="{{logicalElement.id}}" name="logicalElement"
                                                    [checked]="isChecked(logicalElement)"
                                                    (check)="onCheck(logicalElement)"
                                                    (uncheck)="onUncheck(logicalElement)">
                                                </sb-button>
                                            </ng-template>

                                        </span>
                                    </td>

                                    <td class="text-left align-middle">
                                        {{logicalElement.data?.name}}
                                    </td>                                    

                                </tr>

                            </ng-template>

                        </ng-template>

                    </ng-container>
                </sb-table>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col">
                <sb-pagination type="modal" (pageChanged)="onPageChange($event)"
                    (pageSizeChanged)="onPageSizeChange($event)">
                </sb-pagination>
            </div>
        </div>

    </form>

</ng-container>

<ng-template #initialising>


    <div class="d-flex justify-content-center m-1">
        <p class="text-center processing mb-5">
            <span>.</span><span>.</span><span>.</span>
        </p>
    </div>

</ng-template>
