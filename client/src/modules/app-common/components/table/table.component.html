<!--Check if table is responsive:
1) If yes, add the template table code inside an enclosing responsivity div (i.e a div with the correct responsive classes).
2) If no, add the template table code directly.-->
<div *ngIf="responsive else nonresponsive"  [ngClass]="tableResponsivityClasses">
    <ng-container *ngTemplateOutlet="table"></ng-container>
</div>
<ng-template #nonresponsive="">
    <ng-container *ngTemplateOutlet="table"></ng-container>
</ng-template>

<!--The template table code-->
<ng-template #table>
    <table *ngIf="!data" [ngClass]="tableClasses" width="100%">
        <ng-container *ngTemplateOutlet="tableContent"></ng-container>
    </table>
    <table *ngIf="data" id="table" data-classes="table" width="100%">
        <ng-container *ngTemplateOutlet="tableContent"></ng-container>
    </table>
</ng-template>

<ng-template #tableContent>
    <caption *ngIf="captioned">
        <ng-content select="[caption]"></ng-content>
    </caption>
    <thead *ngIf="headed">
        <ng-content select="[header]"></ng-content>
    </thead>
    <tfoot *ngIf="footed">
        <ng-content select="[footer]"></ng-content>
    </tfoot>
    <tbody *ngIf="bodied">
        <ng-content select="[body]"></ng-content>
    </tbody>
</ng-template>
