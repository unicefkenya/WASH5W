<div class="d-flex flex-column flex-md-row justify-content-center justify-content-md-between p-1">
    <ngb-pagination [collectionSize]="total$ | async" [(page)]="page" [pageSize]="pageSize" [maxSize]="3" [rotate]="true" [ellipses]="false" [boundaryLinks]="true" class="text-primary">

    </ngb-pagination>
    <select class="custom-select" style="width: auto;" name="pageSize" [(ngModel)]="pageSize">
        <option [ngValue]="3">3 items per page</option>
        <option [ngValue]="5">5 items per page</option>
        <option [ngValue]="10">10 items per page</option>
        <option [ngValue]="20">20 items per page</option>
        <option [ngValue]="40">40 items per page</option>
        <option [ngValue]="80">80 items per page</option>
    </select>
</div>
