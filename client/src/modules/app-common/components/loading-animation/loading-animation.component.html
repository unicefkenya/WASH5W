<div class="d-flex justify-content-center m-1" *ngIf="(loading$ | async) && type == 'spinner'">
  <div class="spinner-border text-success" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>

<div class="d-flex justify-content-center m-1" *ngIf="(loading$ | async) && type == 'bars'">
  <p class="text-center processing mb-5">
      <span>.</span><span>.</span><span>.</span>
  </p>
</div>
