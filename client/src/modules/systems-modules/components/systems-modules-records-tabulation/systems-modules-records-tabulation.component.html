<form>

    <div class="d-flex bd-highlight">
        <div class="w-100 bd-highlight">
            <sb-search placeholder="Search by systems modules names" (searched)="onSearchTermChange($event)"></sb-search>
        </div>
        <div class="flex-shrink-1 bd-highlight">
            <sb-loading-animation type="bars"></sb-loading-animation>
        </div>
    </div>

    <!--For Small-Sized Devices Only-->
    <div class="row d-md-none">
        <div class="col">
            <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                <ng-container header>
                    <tr *ngIf="isProductionEnvironment()">
                        <th scope="col" class="col-sm-12 text-left align-middle">Name</th>
                    </tr>                     
                    <tr *ngIf="isDevelopmentEnvironment()">
                        <th scope="col" class="col-sm-10 text-left align-middle">Name</th>
                        <th scope="col" class="col-sm-2 text-center align-middle">Actions</th>
                    </tr>                   
                </ng-container>

                <ng-container body>
                    <tr *ngFor="let systemModule of systemsModulesDataService.systemsModules$ | async; index as i"  >

                        <td class="text-left align-middle">
                            {{systemModule.data?.name}}
                        </td>

                        <td *ngIf="isDevelopmentEnvironment()" class="text-center align-middle">
                            <span class="d-flex flex-row-reverse">
                                <sb-button action="delete" entity="System Module" id="{{systemModule.id}}"
                                    (delete)="onDeleteSystemModule($event)" tooltip="Delete {{systemModule.data?.name}}"></sb-button>
                                <sb-button action="update" entity="System Module" id="{{systemModule.id}}"
                                    (update)="onUpdateSystemModule($event)" tooltip="Update {{systemModule.data?.name}}"></sb-button>
                            </span>
                        </td>

                    </tr>
                </ng-container>

                <ng-container footer>
                    <tr *ngIf="isDevelopmentEnvironment()">
                        <td scope="col" colspan="2" class="align-middle">
                            <span class="d-flex flex-row flex-row-reverse">
                                <sb-button action="add" entity="System Module" (add)="onAddSystemModule()"></sb-button>
                            </span>

                        </td>
                    </tr>
                </ng-container>

            </sb-table>
        </div>
    </div>

    <!--For Middle-Sized Devices Upwards-->
    <div class="row d-none d-md-block">
        <div class="col">
            <sb-table [captioned]="false" [headed]="true" [bodied]="true" [footed]="true" [stripped]="true" [hoverable]="true" [bordered]="true">
                <ng-container header>
                    <tr *ngIf="isProductionEnvironment()">
                        <th scope="col" class="col-md-1 text-center align-middle">#</th>
                        <th scope="col" class="col-md-9 text-left align-middle">Name</th>  
                        <th scope="col" class="col-md-1 text-center align-middle">Enabled</th>  
                        <th scope="col" class="col-md-1 text-center align-middle">Customisable</th>
                    </tr>                     
                    <tr *ngIf="isDevelopmentEnvironment()">
                        <th scope="col" class="col-md-1 text-center align-middle">#</th>
                        <th scope="col" class="col-md-8 text-left align-middle">Name</th>  
                        <th scope="col" class="col-md-1 text-center align-middle">Enabled</th>  
                        <th scope="col" class="col-md-1 text-center align-middle">Customisable</th>                
                        <th scope="col" class="col-md-1 text-center align-middle">Actions</th>
                    </tr>                   
                </ng-container>

                <ng-container body>

                    <tr *ngFor="let systemModule of systemsModulesDataService.systemsModules$ | async; index as i"  >

                        <td class="text-center align-middle">
                            {{i + 1 + paginationOffset}}
                        </td>

                        <td class="text-left align-middle">
                            {{systemModule.data?.name}}
                        </td>     
                        
                        <td class="text-center align-middle">
                            {{systemModule.data?.enabled? "Yes" : "No"}}
                        </td>    
                        
                        <td class="text-center align-middle">
                            {{systemModule.data?.customisable? "Yes" : "No"}}
                        </td>                         

                        <td *ngIf="isDevelopmentEnvironment()" class="text-center align-middle">
                            <span class="d-flex flex-row-reverse">
                                <sb-button action="delete" entity="System Module" id="{{systemModule.id}}"
                                    (delete)="onDeleteSystemModule($event)" tooltip="Delete {{systemModule.data?.name}}"></sb-button>
                                <sb-button action="update" entity="System Module" id="{{systemModule.id}}"
                                    (update)="onUpdateSystemModule($event)" tooltip="Update {{systemModule.data?.name}}"></sb-button>
                            </span>
                        </td>

                    </tr>

                </ng-container>

                <ng-container footer>
                    <tr *ngIf="isDevelopmentEnvironment()">
                        <td scope="col" colspan="5" class="align-middle">
                            <span class="d-flex flex-row flex-row-reverse">
                                <sb-button action="add" entity="System Module" (add)="onAddSystemModule()"></sb-button>
                            </span>

                        </td>
                    </tr>
                </ng-container>

            </sb-table>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <sb-pagination (pageChanged)="onPageChange($event)" (pageSizeChanged)="onPageSizeChange($event)">
            </sb-pagination>
        </div>
    </div>

</form>
