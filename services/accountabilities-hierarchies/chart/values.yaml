# Default values for the Microservice's Helm Chart.
# This is a YAML-formatted file.

# MICROSERVICE
# ----------------------------------------------------------------------------------------
microservice:

  # Ingress
  ingress:
    name: accountabilities-hierarchies
    class: traefik
    rules:
      host: cloud.miles.co.ke
      http:
        path: /api/v1/accountabilities_hierarchies
        backend:
          service:
            name: accountabilities-hierarchies
            port:
              number: 80

  # Service
  service:
    name: accountabilities-hierarchies
    port:
      default: 80
      target: 8080

  # Deployment
  deployment:
    name: accountabilities-hierarchies

  # Application / Application Replicas
  application:
    name: accountabilities-hierarchies
    version: 0.0.1
    image:
      id: cloud.miles.co.ke:5043/accountabilities-hierarchies
      tag: 0.0.1
      pull:
        policy: Always
        secret: regcred
    environment: 
      postgres:
        host: bitnami-postgres-postgresql        
    replicas: 1

