apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.microservice.ingress.name }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.microservice.ingress.class }}
spec:
  rules:
  - host: {{.Values.microservice.ingress.rules.host}}
    http:
      paths:
      - path: {{ .Values.microservice.ingress.rules.http.path}}
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.microservice.ingress.rules.http.backend.service.name}}
            port:
              number: {{ .Values.microservice.ingress.rules.http.backend.service.port.number}}


