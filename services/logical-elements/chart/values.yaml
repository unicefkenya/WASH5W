# Default values for the Microservice's Helm Chart.
# This is a YAML-formatted file.

# MICROSERVICE
# ----------------------------------------------------------------------------------------
microservice:

  # Ingress
  ingress:
    name: logicalElements
    class: traefik
    rules:
      host: cloud.miles.co.ke
      http:
        path: /api/v1/logicalElements
        backend:
          service:
            name: logicalElements
            port:
              number: 80

  # Service
  service:
    name: logicalElements
    port:
      default: 80
      target: 8080

  # Deployment
  deployment:
    name: logicalElements

  # Application / Application Replicas
  application:
    name: logicalElements
    version: 0.0.1
    image:
      id: cloud.miles.co.ke:5043/logicalElements
      tag: 0.0.1
      pull:
        policy: Always
        secret: regcred
    environment:
      postgres:
        host: bitnami-postgres-postgresql
    replicas: 1

